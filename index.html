<template id="lec-mech">
<p class="lead">ทุกบทในฟิสิกส์เริ่มจากคำถามเดียวกัน: สิ่งต่าง ๆ เคลื่อนที่อย่างไร และอะไรทำให้มันเคลื่อนที่ บทนี้วางรากฐานที่ทุกบทถัดไปต้องใช้ ตั้งแต่หน่วย เวกเตอร์ กฎของนิวตัน ไปจนถึงพลังงานและวงโคจร</p>

<h2 id="s1"><span class="num">1</span>ปริมาณ หน่วย และเวกเตอร์</h2>
<p>ระบบหน่วย SI มีหน่วยฐาน 7 หน่วย ได้แก่ เมตร (m) กิโลกรัม (kg) วินาที (s) แอมแปร์ (A) เคลวิน (K) โมล (mol) และแคนเดลา (cd) หน่วยอื่นสร้างจากหน่วยฐาน เช่น นิวตัน \(1\ \text{N} = 1\ \text{kg·m/s}^2\)</p>
<p>ปริมาณที่บอกแค่ขนาดเรียกว่า<strong>สเกลาร์</strong> (มวล เวลา ระยะทาง พลังงาน) ส่วนปริมาณที่ต้องบอกทั้งขนาดและทิศเรียกว่า<strong>เวกเตอร์</strong> (การกระจัด ความเร็ว ความเร่ง แรง โมเมนตัม) เวกเตอร์แยกเป็นองค์ประกอบได้</p>
<div class="eq">\[ A_x = A\cos\theta, \qquad A_y = A\sin\theta, \qquad A = \sqrt{A_x^2 + A_y^2} \]</div>
<div class="wx"><div class="wx-q">ลากกระเป๋าเดินทางด้วยแรง 50 N ผ่านด้ามจับที่ทำมุม 60° กับพื้นราบ แรงนี้มีองค์ประกอบในแนวระดับและแนวดิ่งเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> ขนาดแรง \(F = 50\ \text{N}\) มุมวัดจากแนวระดับ \(\theta = 60^\circ\) หาองค์ประกอบแนวระดับ \(F_x\) และแนวดิ่ง \(F_y\)</li>
<li><b>เลือกสมการ:</b> มุมวัดจากแนวระดับ องค์ประกอบที่อยู่ติดมุม (แนวระดับ) ใช้ cos อีกองค์ประกอบใช้ sin: \(F_x = F\cos\theta,\ F_y = F\sin\theta\)</li>
<li><b>แทนค่า:</b> \(F_x = 50\cos 60^\circ = 50(0.5) = 25\ \text{N}\) และ \(F_y = 50\sin 60^\circ = 50(0.866) \approx 43.3\ \text{N}\)</li>
<li><b>ตรวจคำตอบ:</b> \(\sqrt{25^2 + 43.3^2} \approx 50\ \text{N}\) เท่าขนาดแรงเดิม ✓ มีเพียง 25 N ที่ดึงกระเป๋าไปข้างหน้า ส่วน 43.3 N ช่วยยกกระเป๋าขึ้น</li>
</ol></div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ระยะทางกับการกระจัดคือสิ่งเดียวกัน</p>
<p class="ok"><b>ที่ถูกต้อง:</b> วิ่งรอบสนาม 400 m แล้วกลับจุดเดิม ระยะทางคือ 400 m แต่การกระจัดเป็นศูนย์ เพราะการกระจัดเป็นเวกเตอร์จากจุดเริ่มถึงจุดสุดท้าย อัตราเร็วเฉลี่ยกับความเร็วเฉลี่ยจึงต่างกันได้ด้วย</p></div>

<h2 id="s2"><span class="num">2</span>การเคลื่อนที่แนวตรงด้วยความเร่งคงตัว</h2>
<p>ความเร่งคืออัตราการเปลี่ยนความเร็ว \(a = \Delta v / \Delta t\) ถ้าความเร่งคงตัว สมการทั้งสี่ใช้ได้เสมอ</p>
<div class="eq">\[ v = u + at, \qquad s = ut + \tfrac12 at^2, \qquad v^2 = u^2 + 2as, \qquad s = \tfrac{u+v}{2}\,t \]</div>
<p>วัตถุที่ตกอย่างอิสระใกล้ผิวโลกมีความเร่ง \(g \approx 9.8\ \text{m/s}^2\) ลงในแนวดิ่ง (โจทย์มักให้ใช้ 10) โดยไม่ขึ้นกับมวล ถ้าไม่คิดแรงต้านอากาศ</p>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
ความเร่งคือ “ความเร็วที่เปลี่ยนไปทุกวินาที” ลองนึกถึงเข็มมาตรวัดของรถที่ขยับขึ้นทีละ 10 km/h ทุกวินาที วัตถุที่ตกก็เหมือนกัน เข็มความเร็วของมันขยับเพิ่มขึ้นราว 10 m/s ทุกวินาที</div>
<div class="wx"><div class="wx-q">ปล่อยลูกบอลจากที่สูง 20 m จะใช้เวลาเท่าใดจึงถึงพื้น และขณะถึงพื้นมีอัตราเร็วเท่าใด (ไม่คิดแรงต้านอากาศ ใช้ \(g = 10\ \text{m/s}^2\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> ปล่อยจากหยุดนิ่ง \(u = 0\) ระยะตก \(s = 20\ \text{m}\) ความเร่ง \(a = g = 10\ \text{m/s}^2\) (ให้ทิศลงเป็นบวก) หาเวลา \(t\) และอัตราเร็ว \(v\)</li>
<li><b>เลือกสมการ:</b> สมการที่มี \(u, s, a, t\) ครบ คือ \(s = ut + \tfrac12 at^2\)</li>
<li><b>แทนค่า:</b> \(20 = 0 + \tfrac12(10)t^2 = 5t^2\) \(\Rightarrow t^2 = 4\) \(\Rightarrow t = 2\ \text{s}\)</li>
<li><b>หาอัตราเร็ว:</b> \(v = u + at = 0 + (10)(2) = 20\ \text{m/s}\) ตรวจด้วย \(v^2 = u^2 + 2as = 2(10)(20) = 400\) ได้ \(v = 20\ \text{m/s}\) ตรงกัน ✓</li>
</ol></div>

<h2 id="s3"><span class="num">3</span>การเคลื่อนที่แบบโพรเจกไทล์</h2>
<p>เมื่อขว้างวัตถุเฉียงขึ้น ให้แยกการเคลื่อนที่เป็นสองแนวที่<strong>ไม่ขึ้นต่อกัน</strong> แนวระดับไม่มีแรง จึงมีความเร็วคงตัว แนวดิ่งมีความเร่ง \(g\) ลง</p>
<div class="eq">\[ x = (u\cos\theta)\,t, \qquad y = (u\sin\theta)\,t - \tfrac12 g t^2 \]</div>
<p>ถ้าจุดยิงและจุดตกอยู่ระดับเดียวกัน</p>
<div class="eq">\[ T = \frac{2u\sin\theta}{g}, \qquad H = \frac{u^2\sin^2\theta}{2g}, \qquad R = \frac{u^2\sin 2\theta}{g} \]</div>
<ul>
  <li>ระยะตกไกลที่สุดเมื่อ \(\theta = 45^\circ\)</li>
  <li>มุมที่รวมกันได้ 90° (เช่น 30° กับ 60°) ให้ระยะตกเท่ากัน แต่มุมที่ชันกว่าลอยนานกว่าและขึ้นสูงกว่า</li>
</ul>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
ส่องไฟจากด้านบนและด้านข้างของลูกบอลที่ถูกขว้าง เงาบนพื้นเลื่อนไปด้วยความเร็วคงที่ ส่วนเงาบนผนังขึ้นแล้วตกเหมือนลูกบอลที่โยนตรงขึ้นฟ้า การเคลื่อนที่จริงคือสองเงานี้รวมกัน</div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ที่จุดสูงสุด ความเร็วของวัตถุเป็นศูนย์</p>
<p class="ok"><b>ที่ถูกต้อง:</b> เฉพาะ \(v_y\) ที่เป็นศูนย์ ส่วน \(v_x = u\cos\theta\) ยังเท่าเดิม และความเร่งเป็น \(g\) ลงตลอดการเคลื่อนที่ ไม่เคยเป็นศูนย์</p></div>
<div class="wx"><div class="wx-q">ตีลูกกอล์ฟออกจากพื้นราบด้วยอัตราเร็ว 20 m/s ทำมุม 30° กับแนวระดับ ลูกกอล์ฟลอยอยู่ในอากาศนานเท่าใด และตกห่างจากจุดตีเท่าใด (ไม่คิดแรงต้านอากาศ ใช้ \(g = 10\ \text{m/s}^2\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(u = 20\ \text{m/s},\ \theta = 30^\circ,\ g = 10\ \text{m/s}^2\) จุดตีกับจุดตกอยู่ระดับเดียวกัน หาเวลาลอย \(T\) และระยะตก \(R\)</li>
<li><b>แยกความเร็วต้นเป็นสองแนว:</b> \(u_x = u\cos\theta = 20(0.866) \approx 17.3\ \text{m/s}\) คงที่ตลอด และ \(u_y = u\sin\theta = 20(0.5) = 10\ \text{m/s}\)</li>
<li><b>แนวดิ่ง หาเวลาลอย:</b> ลูกขึ้นจนหยุดแล้วตกกลับลงมาที่ระดับเดิม \(T = \dfrac{2u_y}{g} = \dfrac{2(10)}{10} = 2\ \text{s}\)</li>
<li><b>แนวระดับ หาระยะตก:</b> \(R = u_x T = (17.3)(2) \approx 34.6\ \text{m}\) ตรวจด้วย \(R = \dfrac{u^2\sin 2\theta}{g} = \dfrac{400\sin 60^\circ}{10} \approx 34.6\ \text{m}\) ✓</li>
</ol></div>
<p><a class="try" href="#mech-sim">ลองยิงด้วยมุม 30° และ 60° ในการจำลอง →</a></p>

<h2 id="s4"><span class="num">4</span>กฎการเคลื่อนที่ของนิวตัน</h2>
<ul>
  <li><strong>ข้อที่ 1 (ความเฉื่อย):</strong> ถ้าแรงลัพธ์เป็นศูนย์ วัตถุจะอยู่นิ่งหรือเคลื่อนที่ด้วยความเร็วคงตัว</li>
  <li><strong>ข้อที่ 2:</strong> แรงลัพธ์ทำให้เกิดความเร่ง \(\Sigma\vec F = m\vec a\)</li>
  <li><strong>ข้อที่ 3:</strong> แรงกิริยาและปฏิกิริยามีขนาดเท่ากัน ทิศตรงข้าม และกระทำต่อวัตถุ<em>คนละก้อน</em></li>
</ul>
<div class="eq">\[ \Sigma \vec F = m\vec a, \qquad f_s \le \mu_s N, \qquad f_k = \mu_k N \]</div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด (1):</b> วัตถุที่กำลังเคลื่อนที่ต้องมีแรงดันไปในทิศที่มันเคลื่อนที่เสมอ</p>
<p class="ok"><b>ที่ถูกต้อง:</b> แรงไม่ได้ทำให้วัตถุ “เคลื่อนที่” แต่ทำให้ความเร็ว “เปลี่ยน” ยานอวกาศที่ดับเครื่องยังเคลื่อนที่ต่อไปได้เรื่อย ๆ</p>
<p class="x"><b>เข้าใจผิด (2):</b> แรงกิริยาและปฏิกิริยาหักล้างกันหมด วัตถุจึงไม่น่าจะเคลื่อนที่ได้</p>
<p class="ok"><b>ที่ถูกต้อง:</b> สองแรงนี้กระทำต่อวัตถุคนละก้อน จึงไม่นำมารวมเป็นแรงลัพธ์ของวัตถุเดียวกัน</p></div>
<div class="wx"><div class="wx-q">คนมวล 60 kg ยืนบนตาชั่งในลิฟต์ ขณะลิฟต์เร่งขึ้นด้วยความเร่ง 2 m/s² ตาชั่งอ่านค่าแรงได้เท่าใด (ใช้ \(g = 9.8\ \text{m/s}^2\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(m = 60\ \text{kg}\) ความเร่ง \(a = 2\ \text{m/s}^2\) ทิศขึ้น \(g = 9.8\ \text{m/s}^2\) ตาชั่งอ่านค่าแรงที่มันดันเท้าคนขึ้น (แรงตั้งฉาก \(N\)) จึงหา \(N\)</li>
<li><b>เขียนแรงที่กระทำต่อคน:</b> แรงตั้งฉาก \(N\) ชี้ขึ้น และน้ำหนัก \(mg\) ชี้ลง ใช้กฎข้อที่สองโดยให้ทิศขึ้นเป็นบวก: \(\Sigma F = N - mg = ma\)</li>
<li><b>แทนค่า:</b> \(N = m(g + a)\) \(= 60(9.8 + 2)\) \(= 60(11.8) = 708\ \text{N}\)</li>
<li><b>ตีความ:</b> น้ำหนัก \(mg = 588\ \text{N}\) แต่ตาชั่งอ่านได้ 708 N เพราะพื้นต้องดันมากกว่าน้ำหนัก จึงเกิดแรงลัพธ์ชี้ขึ้น \(ma = 120\ \text{N}\) ที่ทำให้คนเร่งขึ้นไปพร้อมลิฟต์ เราจึงรู้สึกตัวหนักขึ้นตอนลิฟต์เริ่มขึ้น</li>
</ol></div>

<h2 id="s5"><span class="num">5</span>งาน พลังงาน และโมเมนตัม</h2>
<div class="eq">\[ W = Fs\cos\theta, \qquad E_k = \tfrac12 mv^2, \qquad E_p = mgh, \qquad W_{\text{net}} = \Delta E_k, \qquad P = \frac{W}{t} \]</div>
<p>ถ้ามีเพียงแรงโน้มถ่วง (หรือแรงสปริง) ทำงาน พลังงานกล \(E_k + E_p\) คงที่ ส่วนโมเมนตัม \(\vec p = m\vec v\) เปลี่ยนได้ด้วยการดล \(\vec F\Delta t = \Delta\vec p\) และถ้าไม่มีแรงภายนอก โมเมนตัมรวมของระบบคงที่ ใช้ได้กับการชนทุกแบบ</p>
<ul>
  <li><strong>ชนแบบยืดหยุ่น:</strong> โมเมนตัมและพลังงานจลน์คงที่ทั้งคู่</li>
  <li><strong>ชนแบบไม่ยืดหยุ่น:</strong> โมเมนตัมคงที่ แต่พลังงานจลน์บางส่วนกลายเป็นความร้อนและเสียง (ถ้าติดกันไปคือไม่ยืดหยุ่นสมบูรณ์)</li>
</ul>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
พลังงานเหมือนเงินที่ย้ายระหว่างกระเป๋า \(E_k\) กับกระเป๋า \(E_p\) ยอดรวมเท่าเดิมเสมอ จนกว่าแรงเสียดทานจะมา “เก็บภาษี” ไปเป็นความร้อน ซึ่งพลังงานไม่ได้หายไปไหน แค่ย้ายไปอยู่ในรูปที่เรานำกลับมาใช้ได้ยาก</div>
<div class="wx"><div class="wx-q">มวล 2 kg วิ่งด้วยความเร็ว 3 m/s ชนมวล 1 kg ที่อยู่นิ่ง แล้วติดกันไป (ไม่มีแรงภายนอกในแนวการเคลื่อนที่) จงหาความเร็วหลังชน และพลังงานจลน์ที่เปลี่ยนเป็นพลังงานรูปอื่น</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(m_1 = 2\ \text{kg},\ v_1 = 3\ \text{m/s},\) \(m_2 = 1\ \text{kg},\ v_2 = 0\) ชนแล้วติดกันคือชนแบบไม่ยืดหยุ่นสมบูรณ์ หาความเร็วร่วม \(v\) และพลังงานจลน์ที่หายไป</li>
<li><b>เลือกหลัก:</b> ไม่มีแรงภายนอก โมเมนตัมรวมจึงคงที่ (พลังงานจลน์ไม่คงที่ในการชนแบบนี้ จึงใช้หาความเร็วไม่ได้): \(m_1v_1 + m_2v_2 = (m_1 + m_2)v\)</li>
<li><b>แทนค่า:</b> \((2)(3) + (1)(0) = (2 + 1)v\) \(\Rightarrow 6 = 3v\) \(\Rightarrow v = 2\ \text{m/s}\)</li>
<li><b>เทียบพลังงานจลน์:</b> ก่อนชน \(\tfrac12(2)(3^2) = 9\ \text{J}\) หลังชน \(\tfrac12(3)(2^2) = 6\ \text{J}\) จึงมี \(9 - 6 = 3\ \text{J}\) เปลี่ยนเป็นความร้อนและเสียง</li>
</ol></div>

<h2 id="s6"><span class="num">6</span>การเคลื่อนที่แบบวงกลมและความโน้มถ่วง</h2>
<p>วัตถุที่เคลื่อนที่เป็นวงกลมด้วยอัตราเร็วคงที่ยังมีความเร่ง เพราะทิศของความเร็วเปลี่ยนตลอด ความเร่งนี้ชี้เข้าหาศูนย์กลาง</p>
<div class="eq">\[ a_c = \frac{v^2}{r}, \qquad F_c = \frac{mv^2}{r}, \qquad F = \frac{Gm_1m_2}{r^2}, \qquad g = \frac{GM}{R^2}, \qquad v_{\text{orbit}} = \sqrt{\frac{GM}{r}} \]</div>
<p>โดย \(G = 6.674\times10^{-11}\ \text{N·m}^2/\text{kg}^2\) แรงโน้มถ่วงทำหน้าที่เป็นแรงสู่ศูนย์กลางให้ดวงจันทร์ ดาวเทียม และดาวในกาแล็กซี เช่นเดียวกับที่แรงแม่เหล็กทำหน้าที่นี้ให้อนุภาคมีประจุในบทที่ 06 อนุภาคในสนามแม่เหล็ก</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> นักบินอวกาศในสถานีอวกาศลอยได้เพราะไม่มีแรงโน้มถ่วง</p>
<p class="ok"><b>ที่ถูกต้อง:</b> ที่ความสูงราว 400 km ความเร่งโน้มถ่วงยังประมาณ 8.7 m/s² (ราว 90% ของที่ผิวโลก) นักบินลอยเพราะทั้งคนและสถานีกำลังตกอิสระไปรอบโลกพร้อมกัน</p>
<p class="x"><b>เข้าใจผิด:</b> แรงหนีศูนย์กลางเป็นแรงจริงที่ผลักวัตถุออกจากวง</p>
<p class="ok"><b>ที่ถูกต้อง:</b> เมื่อมองจากกรอบอ้างอิงเฉื่อย มีเพียงแรงสู่ศูนย์กลาง ถ้าเชือกขาด วัตถุจะพุ่งไปตามแนวสัมผัสวง ไม่ได้กระเด็นออกตามแนวรัศมี</p></div>
<div class="wx"><div class="wx-q">ผูกก้อนวัตถุมวล 0.5 kg ไว้ที่ปลายเชือกยาว 0.8 m อีกปลายตรึงกับหมุดกลางโต๊ะราบที่ลื่น (ไม่มีแรงเสียดทาน) วัตถุเคลื่อนที่เป็นวงกลมรอบหมุดด้วยอัตราเร็วคงตัว 4 m/s วัตถุมีความเร่งเท่าใด และเชือกตึงเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(m = 0.5\ \text{kg}\) รัศมีวงเท่าความยาวเชือก \(r = 0.8\ \text{m}\) อัตราเร็ว \(v = 4\ \text{m/s}\) หาความเร่ง \(a_c\) และแรงตึงเชือก \(T\)</li>
<li><b>แรงไหนเป็นแรงสู่ศูนย์กลาง:</b> แนวดิ่ง น้ำหนักสมดุลกับแรงที่โต๊ะดันขึ้น แนวระดับมีแรงเดียวคือแรงตึงเชือกที่ดึงเข้าหาหมุด แรงตึงจึงทำหน้าที่เป็นแรงสู่ศูนย์กลาง: \(T = F_c = \dfrac{mv^2}{r}\)</li>
<li><b>แทนค่า:</b> \(a_c = \dfrac{v^2}{r} = \dfrac{4^2}{0.8} = 20\ \text{m/s}^2\) ชี้เข้าหาหมุด และ \(T = ma_c = (0.5)(20) = 10\ \text{N}\)</li>
<li><b>คิดต่อ:</b> ถ้าเชือกขาด แรงสู่ศูนย์กลางหายไป วัตถุจะไถลออกไปเป็นเส้นตรงตามแนวสัมผัสวงด้วยอัตราเร็ว 4 m/s ไม่ได้กระเด็นออกตามแนวรัศมี</li>
</ol></div>

<p class="lead">ทุกสิ่งรอบตัวประกอบด้วยอนุภาคเล็ก ๆ ที่สั่นและวิ่งชนกันไม่หยุด อุณหภูมิ ความดัน และความร้อน ล้วนเป็นผลรวมของการเคลื่อนที่จำนวนมหาศาลนี้</p>

<h2 id="s1"><span class="num">1</span>สสารและแบบจำลองอนุภาค</h2>
<ul>
  <li><strong>ของแข็ง:</strong> อนุภาคอยู่ชิดกันและสั่นรอบตำแหน่งคงที่ จึงคงรูปร่าง</li>
  <li><strong>ของเหลว:</strong> อนุภาคยังชิดกันแต่เลื่อนผ่านกันได้ จึงไหลได้แต่ปริมาตรเกือบคงที่</li>
  <li><strong>แก๊ส:</strong> อนุภาคอยู่ห่างกันมากและวิ่งอิสระ จึงขยายเต็มภาชนะและอัดได้ง่าย</li>
</ul>
<p>สมบัติของของไหลที่ใช้บ่อย ได้แก่ ความหนาแน่น ความดันที่ความลึก \(h\) และแรงลอยตัว (หลักของอาร์คิมิดีส)</p>
<div class="eq">\[ \rho = \frac{m}{V}, \qquad P = P_0 + \rho g h, \qquad F_B = \rho_{f}\, g\, V_{s} \]</div>
<p>\(\rho_f\) คือความหนาแน่นของของไหล และ \(V_s\) คือปริมาตรส่วนที่จมอยู่ในของไหล</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> วัตถุลอยน้ำได้เพราะมันเบา</p>
<p class="ok"><b>ที่ถูกต้อง:</b> วัตถุลอยเมื่อ<em>ความหนาแน่นเฉลี่ย</em>น้อยกว่าของเหลว เรือเหล็กหนักหลายพันตันลอยได้เพราะมีอากาศอยู่ภายใน ทำให้ความหนาแน่นเฉลี่ยของทั้งลำต่ำกว่าน้ำ</p></div>
<div class="wx"><div class="wx-q">ภูเขาน้ำแข็งลอยอยู่ในทะเล ส่วนที่จมอยู่ใต้น้ำคิดเป็นกี่เปอร์เซ็นต์ของปริมาตรทั้งก้อน (ความหนาแน่นของน้ำแข็ง 917 kg/m³ และของน้ำทะเล 1025 kg/m³)</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(\rho_{\text{ice}} = 917\ \text{kg/m}^3\) และ \(\rho_f = 1025\ \text{kg/m}^3\) ให้ปริมาตรทั้งก้อนเป็น \(V\) และส่วนที่จมเป็น \(V_s\) หาสัดส่วน \(V_s/V\)</li>
<li><b>เลือกหลักการ:</b> ก้อนน้ำแข็งลอยนิ่ง แรงลัพธ์เป็นศูนย์ แรงลอยตัวจึงเท่ากับน้ำหนัก และมวล \(m = \rho V\): \(\rho_f\, g\, V_s = mg = \rho_{\text{ice}}\, g\, V\)</li>
<li><b>แทนค่า:</b> \(g\) ตัดกัน \(\dfrac{V_s}{V} = \dfrac{\rho_{\text{ice}}}{\rho_f} = \dfrac{917}{1025} \approx 0.895\) หรือราว 89.5%</li>
<li><b>ตีความ:</b> โผล่พ้นน้ำเพียงราว 10% (“ยอดภูเขาน้ำแข็ง”) สัดส่วนที่จมเท่ากับอัตราส่วนความหนาแน่นพอดี ถ้าวัตถุหนาแน่นกว่าของเหลว แม้จมทั้งก้อนแรงลอยตัวก็ยังน้อยกว่าน้ำหนัก วัตถุจึงจม</li>
</ol></div>

<h2 id="s2"><span class="num">2</span>อุณหภูมิและความร้อน</h2>
<p>อุณหภูมิบอกพลังงานจลน์เฉลี่ยของอนุภาค ส่วนความร้อนคือพลังงานที่ถ่ายโอนเพราะอุณหภูมิต่างกัน ในฟิสิกส์ใช้เคลวิน \(T(\text{K}) = T(^\circ\text{C}) + 273.15\)</p>
<div class="eq">\[ Q = mc\Delta T, \qquad Q = mL \]</div>
<p>สมการแรกใช้เมื่ออุณหภูมิเปลี่ยน สมการที่สองใช้ขณะเปลี่ยนสถานะ ซึ่งอุณหภูมิคงที่</p>
<p>น้ำมีความจุความร้อนจำเพาะราว 4,200 J/(kg·K) ความร้อนแฝงของการหลอมเหลวราว \(3.34\times10^5\) J/kg และของการกลายเป็นไอราว \(2.26\times10^6\) J/kg</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ความร้อนกับอุณหภูมิคือสิ่งเดียวกัน</p>
<p class="ok"><b>ที่ถูกต้อง:</b> อ่างน้ำอุ่นมีอุณหภูมิต่ำกว่าน้ำเดือดหนึ่งถ้วย แต่มีพลังงานภายในรวมมากกว่าหลายเท่าเพราะมีน้ำมากกว่า และขณะน้ำแข็งละลาย ความร้อนเข้าไปแต่อุณหภูมิไม่เปลี่ยน</p></div>
<div class="wx"><div class="wx-q">ต้องใช้ความร้อนเท่าใดทำให้น้ำ 500 g อุ่นจาก 20 °C เป็น 70 °C (ความจุความร้อนจำเพาะของน้ำ \(c = 4200\ \text{J/(kg·K)}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(m = 500\ \text{g} = 0.5\ \text{kg}\), \(c = 4200\ \text{J/(kg·K)}\) อุณหภูมิเปลี่ยนจาก 20 °C เป็น 70 °C หาความร้อน \(Q\)</li>
<li><b>เลือกสมการ:</b> น้ำยังไม่ถึงจุดเดือด จึงไม่เปลี่ยนสถานะ ใช้ \(Q = mc\Delta T\) โดย \(\Delta T = 70 - 20 = 50\ ^\circ\text{C}\) ซึ่งเท่ากับ 50 K (ผลต่างอุณหภูมิเท่ากันทั้งสองหน่วย)</li>
<li><b>แทนค่า:</b> \(Q = (0.5)(4200)(50)\) \(= 105{,}000\ \text{J}\) \(= 1.05\times10^5\ \text{J}\) หรือ 105 kJ</li>
<li><b>ตรวจคำตอบ:</b> หน่วย \(\text{kg} \times \text{J/(kg·K)} \times \text{K} = \text{J}\) ✓ ถ้าเผลอใส่มวลเป็น 500 (กรัม) จะได้ใหญ่ไป 1000 เท่า และถ้าใช้ 70 °C แทนผลต่าง 50 °C จะได้ 147 kJ ซึ่งผิด</li>
</ol></div>

<h2 id="s3"><span class="num">3</span>ทฤษฎีจลน์ของแก๊ส</h2>
<div class="eq">\[ PV = nRT = NkT, \qquad P = \frac13 \frac{N}{V} m\overline{v^2}, \qquad \bar E_k = \frac32 kT, \qquad v_{\text{rms}} = \sqrt{\frac{3kT}{m}} = \sqrt{\frac{3RT}{M}} \]</div>
<p>\(R = 8.314\ \text{J/(mol·K)}\), \(k = 1.38\times10^{-23}\ \text{J/K}\) และ \(M\) คือมวลโมเลกุลเป็น kg/mol เมื่อรวมสมการที่สองกับสมการแรก จะได้ว่าอุณหภูมิคือพลังงานจลน์เฉลี่ยของโมเลกุลนั่นเอง</p>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
ความดันคือ “ฝนลูกบอลจิ๋ว” ที่ตกกระทบผนังไม่หยุด ยิ่งมีลูกบอลในพื้นที่มาก (N/V มาก) หรือลูกบอลวิ่งเร็ว (อุณหภูมิสูง) ผนังยิ่งถูกกระแทกแรงและถี่ขึ้น ความดันจึงสูงขึ้น</div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ที่อุณหภูมิเดียวกัน โมเลกุลทุกตัวเคลื่อนที่เร็วเท่ากัน</p>
<p class="ok"><b>ที่ถูกต้อง:</b> อัตราเร็วกระจายตัวตามการแจกแจงแมกซ์เวลล์–โบลตซ์มันน์ มีทั้งช้าและเร็ว อุณหภูมิบอกเพียงพลังงานจลน์<em>เฉลี่ย</em> แก๊สต่างชนิดที่อุณหภูมิเดียวกันมีพลังงานจลน์เฉลี่ยเท่ากัน แต่โมเลกุลที่เบากว่าเคลื่อนที่เร็วกว่า</p></div>
<div class="wx"><div class="wx-q">หาอัตราเร็ว \(v_{\text{rms}}\) ของโมเลกุลไนโตรเจน (มวลโมเลกุล \(M = 0.028\ \text{kg/mol}\)) ที่อุณหภูมิ 300 K (\(R = 8.314\ \text{J/(mol·K)}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(M = 0.028\ \text{kg/mol}\), \(T = 300\ \text{K}\), \(R = 8.314\ \text{J/(mol·K)}\) หา \(v_{\text{rms}}\)</li>
<li><b>เลือกสมการ:</b> \(v_{\text{rms}} = \sqrt{\dfrac{3RT}{M}}\) โดย \(T\) ต้องเป็นเคลวิน และ \(M\) ต้องเป็น kg/mol (ไม่ใช่ g/mol)</li>
<li><b>แทนค่า:</b> \(\dfrac{3RT}{M} = \dfrac{3(8.314)(300)}{0.028}\) \(= \dfrac{7482.6}{0.028}\) \(\approx 2.67\times10^5\ \text{m}^2/\text{s}^2\) จึงได้ \(v_{\text{rms}} \approx 517\ \text{m/s}\)</li>
<li><b>ตีความ:</b> โมเลกุลอากาศรอบตัวเราวิ่งเร็วกว่าเสียงในอากาศ (ราว 340 m/s) ถ้าเผลอใส่ \(M = 28\) จะได้เพียงราว 16 m/s และถ้าใช้อุณหภูมิเป็นองศาเซลเซียสก็จะผิดเช่นกัน</li>
</ol></div>
<p><a class="try" href="#thermo-sim">ดูโมเลกุลชนผนังและวัดความดันในการจำลอง →</a></p>

<h2 id="s4"><span class="num">4</span>กฎข้อที่หนึ่งของอุณหพลศาสตร์</h2>
<p>พลังงานไม่สูญหาย ความร้อนที่ให้แก่แก๊สจะไปเพิ่มพลังงานภายในและส่วนหนึ่งใช้ทำงาน</p>
<div class="eq">\[ Q = \Delta U + W, \qquad W = P\Delta V, \qquad U = \tfrac32 nRT \]</div>
<p>\(W = P\Delta V\) ใช้เมื่อความดันคงที่ และ \(U = \tfrac32 nRT\) ใช้กับแก๊สอะตอมเดี่ยว</p>
<table class="tbl">
<tr><th>กระบวนการ</th><th>เงื่อนไข</th><th>ผลที่ได้</th></tr>
<tr><td>ไอโซเทอร์มอล</td><td>\(T\) คงที่</td><td>\(\Delta U = 0\) จึง \(Q = W\)</td></tr>
<tr><td>ไอโซบาริก</td><td>\(P\) คงที่</td><td>\(W = P\Delta V\)</td></tr>
<tr><td>ไอโซคอริก</td><td>\(V\) คงที่</td><td>\(W = 0\) จึง \(Q = \Delta U\)</td></tr>
<tr><td>อะเดียแบติก</td><td>\(Q = 0\)</td><td>\(\Delta U = -W\) อัดแล้วร้อนขึ้น ขยายแล้วเย็นลง</td></tr>
</table>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>ข้อควรระวัง:</b> หนังสือบางเล่มเขียน \(\Delta U = Q + W\)</p>
<p class="ok"><b>ที่ถูกต้อง:</b> ทั้งสองแบบถูก ขึ้นกับนิยามของ \(W\) ในบทนี้ \(W\) คืองานที่แก๊ส<em>ทำ</em> ส่วนอีกแบบหนึ่ง \(W\) คืองานที่ทำ<em>ต่อ</em>แก๊ส ต้องดูนิยามในโจทย์ก่อนใส่เครื่องหมาย</p></div>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
สูบลมจักรยานเร็ว ๆ แล้วจับปลายสูบจะรู้สึกอุ่น เพราะเราอัดแก๊สเร็วจนความร้อนออกไปไม่ทัน (ใกล้อะเดียแบติก) งานที่มือทำจึงกลายเป็นพลังงานภายในของแก๊ส</div>
<div class="wx"><div class="wx-q">แก๊สในกระบอกสูบได้รับความร้อน 1000 J และขยายตัวที่ความดันคงที่ \(2.0\times10^5\ \text{Pa}\) จากปริมาตร 3.0 L เป็น 5.0 L พลังงานภายในของแก๊สเปลี่ยนไปเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> แก๊สได้รับความร้อน \(Q = +1000\ \text{J}\), ความดัน \(P = 2.0\times10^5\ \text{Pa}\) คงที่, \(\Delta V = 5.0 - 3.0 = 2.0\ \text{L}\) \(= 2.0\times10^{-3}\ \text{m}^3\) หา \(\Delta U\)</li>
<li><b>เลือกสมการ:</b> กฎข้อที่หนึ่ง \(Q = \Delta U + W\) โดย \(W\) คืองานที่แก๊สทำ และเมื่อความดันคงที่ \(W = P\Delta V\)</li>
<li><b>แทนค่า:</b> \(W = (2.0\times10^5)(2.0\times10^{-3}) = 400\ \text{J}\) (บวก เพราะแก๊สขยายตัวดันลูกสูบ) จึงได้ \(\Delta U = Q - W = 1000 - 400 = 600\ \text{J}\)</li>
<li><b>ตีความ:</b> ความร้อน 1000 J ถูกแบ่ง 600 J เพิ่มพลังงานภายใน (แก๊สร้อนขึ้น) และอีก 400 J ใช้ดันลูกสูบ ตรวจหน่วย: \(\text{Pa}\times\text{m}^3 = \tfrac{\text{N}}{\text{m}^2}\times\text{m}^3 = \text{N·m} = \text{J}\) ✓ ถ้าลืมแปลงลิตรเป็น m³ จะได้งานถึง 400,000 J ซึ่งผิดชัดเจน</li>
</ol></div>

<h2 id="s5"><span class="num">5</span>กฎข้อที่สองและเครื่องยนต์ความร้อน</h2>
<p>ความร้อนไหลจากที่ร้อนไปที่เย็นได้เอง แต่ไม่ไหลย้อนกลับเองโดยไม่มีงานจากภายนอก เครื่องยนต์ความร้อนรับความร้อน \(Q_H\) จากแหล่งร้อน ทำงาน \(W\) และต้องทิ้งความร้อน \(Q_C\) ให้แหล่งเย็นเสมอ</p>
<div class="eq">\[ \eta = \frac{W}{Q_H} = 1 - \frac{Q_C}{Q_H}, \qquad \eta_{\max} = 1 - \frac{T_C}{T_H} \]</div>
<p>\(\eta_{\max}\) คือประสิทธิภาพของเครื่องยนต์คาร์โนต์ในอุดมคติ โดย \(T_H\) และ \(T_C\) ต้องเป็นเคลวิน</p>
<p>อีกมุมหนึ่งของกฎข้อนี้คือ เอนโทรปีของระบบโดดเดี่ยวไม่ลดลง ระบบมีแนวโน้มไปสู่สถานะที่เป็นไปได้หลายแบบที่สุด</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ถ้าออกแบบเครื่องยนต์ดีพอ จะเปลี่ยนความร้อนเป็นงานได้ 100%</p>
<p class="ok"><b>ที่ถูกต้อง:</b> แม้เครื่องยนต์ในอุดมคติก็ยังมีประสิทธิภาพไม่เกิน \(1 - T_C/T_H\) เช่น ทำงานระหว่าง 600 K กับ 300 K ได้สูงสุดเพียง 50%</p></div>
<div class="wx"><div class="wx-q">ในแต่ละรอบ เครื่องยนต์ความร้อนรับความร้อน 1000 J จากแหล่งร้อน 500 K และทิ้งความร้อน 700 J ให้แหล่งเย็น 300 K เครื่องยนต์นี้มีประสิทธิภาพเท่าใด และตามทฤษฎียังทำได้ดีขึ้นอีกถึงเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(Q_H = 1000\ \text{J}\), \(Q_C = 700\ \text{J}\), \(T_H = 500\ \text{K}\), \(T_C = 300\ \text{K}\) หาประสิทธิภาพจริง \(\eta\) และประสิทธิภาพสูงสุด \(\eta_{\max}\)</li>
<li><b>เลือกสมการ:</b> ครบรอบเครื่องยนต์กลับสู่สถานะเดิม พลังงานไม่สูญหาย งาน \(W = Q_H - Q_C\) ประสิทธิภาพ \(\eta = W/Q_H\) และขีดจำกัด \(\eta_{\max} = 1 - T_C/T_H\) (อุณหภูมิเป็นเคลวิน)</li>
<li><b>แทนค่า:</b> \(W = 1000 - 700 = 300\ \text{J}\) จึงได้ \(\eta = \dfrac{300}{1000} = 0.30\) หรือ 30% และ \(\eta_{\max} = 1 - \dfrac{300}{500} = 0.40\) หรือ 40%</li>
<li><b>ตีความ:</b> 30% ไม่เกิน 40% ✓ เครื่องยนต์นี้เป็นไปได้ เครื่องยนต์คาร์โนต์ในอุดมคติจะทำงานได้ 400 J ต่อรอบ แต่ก็ยังต้องทิ้งความร้อนอย่างน้อย 600 J ให้แหล่งเย็นเสมอ</li>
</ol></div>

<div class="sumbox"><h3>สูตรสำคัญ</h3>
<div class="row"><span>ความร้อน</span><span>\(Q = mc\Delta T,\;\; Q = mL\)</span></div>
<div class="row"><span>แก๊สอุดมคติ</span><span>\(PV = nRT = NkT\)</span></div>
<div class="row"><span>ทฤษฎีจลน์</span><span>\(\bar E_k = \tfrac32kT,\;\; v_{\text{rms}} = \sqrt{3RT/M}\)</span></div>

<div class="row"><span>ประสิทธิภาพสูงสุด</span><span>\(\eta_{\max} = 1 - T_C/T_H\)</span></div>
</div>

<p class="lead">เสียง แสง และคลื่นน้ำต่างพาพลังงานไปได้ไกล โดยที่ตัวกลางไม่ได้เดินทางไปด้วย บทนี้ดูว่าคลื่นเดินทาง ซ้อนทับ หักเห และสร้างภาพได้อย่างไร และเป็นสะพานไปสู่บทที่ 07 คลื่นแม่เหล็กไฟฟ้า</p>

<h2 id="s1"><span class="num">1</span>ธรรมชาติของคลื่น</h2>
<ul>
  <li><strong>คลื่นกล</strong> ต้องอาศัยตัวกลาง เช่น เสียง คลื่นน้ำ คลื่นในเส้นเชือก ส่วน<strong>คลื่นแม่เหล็กไฟฟ้า</strong>เดินทางในสุญญากาศได้</li>
  <li><strong>คลื่นตามขวาง</strong> อนุภาคตัวกลางสั่นตั้งฉากกับทิศของคลื่น ส่วน<strong>คลื่นตามยาว</strong> (เช่น เสียงในอากาศ) สั่นในแนวเดียวกับทิศของคลื่น</li>
</ul>
<div class="eq">\[ v = f\lambda = \frac{\lambda}{T}, \qquad v_{\text{string}} = \sqrt{\frac{F_T}{\mu}} \]</div>
<p>อัตราเร็วของคลื่นขึ้นกับ<strong>ตัวกลาง</strong> เช่น เสียงในอากาศที่ 20 °C มีอัตราเร็วราว 343 m/s ส่วนในเส้นเชือกขึ้นกับแรงตึง \(F_T\) และมวลต่อความยาว \(\mu\)</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> เพิ่มความถี่แล้วคลื่นจะเดินทางเร็วขึ้น</p>
<p class="ok"><b>ที่ถูกต้อง:</b> ในตัวกลางเดิม อัตราเร็วคงที่ เมื่อเพิ่มความถี่ ความยาวคลื่นจะสั้นลงเพื่อให้ \(f\lambda\) เท่าเดิม</p></div>

<div class="wx"><div class="wx-q">ลำโพงเล่นโน้ต A ความถี่ 440 Hz ในอากาศ (เสียงเร็ว 343 m/s) เสียงนี้มีความยาวคลื่นเท่าใด และถ้าเสียงเดียวกันเข้าไปในน้ำ (เสียงเร็ว 1480 m/s) ความยาวคลื่นเป็นเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(f = 440\ \text{Hz}\), \(v_{\text{air}} = 343\ \text{m/s}\), \(v_{\text{water}} = 1480\ \text{m/s}\) หาความยาวคลื่น \(\lambda\) ในตัวกลางทั้งสอง</li>
<li><b>เลือกสมการ:</b> \(v = f\lambda\) จึงได้ \(\lambda = \dfrac{v}{f}\) ความถี่ถูกกำหนดโดยลำโพง จึงเท่ากันทั้งในอากาศและในน้ำ ส่วนอัตราเร็วขึ้นกับตัวกลาง</li>
<li><b>แทนค่า:</b> ในอากาศ \(\lambda = \dfrac{343}{440}\) \(\approx 0.780\ \text{m}\) ในน้ำ \(\lambda = \dfrac{1480}{440}\) \(\approx 3.36\ \text{m}\)</li>
<li><b>ตีความ:</b> ตรวจหน่วย \(\dfrac{\text{m/s}}{\text{1/s}} = \text{m}\) ✓ เสียงในน้ำเร็วกว่าราว 4.3 เท่า ความยาวคลื่นจึงยาวกว่า 4.3 เท่า แต่ยังเป็นโน้ต A เหมือนเดิม เพราะระดับเสียงที่หูได้ยินผูกกับความถี่ ไม่ใช่ความยาวคลื่น</li>
</ol></div>

<h2 id="s2"><span class="num">2</span>การซ้อนทับและการแทรกสอด</h2>
<p>เมื่อคลื่นสองขบวนมาพบกัน การกระจัดรวมคือผลบวกของการกระจัดแต่ละขบวน (หลักการซ้อนทับ) สำหรับแหล่งกำเนิดอาพันธ์สองแหล่งที่มีเฟสตรงกัน</p>
<div class="eq">\[ |S_1P - S_2P| = n\lambda, \qquad |S_1P - S_2P| = \left(n + \tfrac12\right)\lambda \]</div>
<p>สมการแรกคือจุดที่คลื่นเสริมกัน (ปฏิบัพ) สมการที่สองคือจุดที่หักล้างกัน (บัพ) โดย \(n = 0, 1, 2, \dots\)</p>
<p>จุดที่หักล้างกันเรียงตัวเป็นเส้นโค้งไฮเพอร์โบลาที่มีแหล่งกำเนิดทั้งสองเป็นจุดโฟกัส เรียกว่าแนวบัพ ถ้าคลื่นสองขบวนเคลื่อนที่สวนกันในเชือกจะเกิด<strong>คลื่นนิ่ง</strong> บัพอยู่ห่างกัน \(\lambda/2\) และเชือกที่ตรึงปลายทั้งสองสั่นได้ที่ความถี่ \(f_n = \dfrac{nv}{2L}\)</p>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
ใช้นิ้วสองนิ้วแตะผิวน้ำพร้อมกัน ที่บางจุดยอดคลื่นจากนิ้วหนึ่งมาเจอยอดคลื่นจากอีกนิ้วพอดี น้ำจึงกระเพื่อมแรง ที่บางจุดยอดมาเจอท้องพอดี น้ำเกือบนิ่ง ตำแหน่งของจุดเหล่านี้ขึ้นอยู่กับว่าระยะทางจากสองนิ้วต่างกันกี่ความยาวคลื่น</div>
<div class="wx"><div class="wx-q">แหล่งกำเนิดคลื่นน้ำ S₁ และ S₂ สั่นด้วยเฟสตรงกัน ให้คลื่นความยาวคลื่น 2.0 cm จุด P ห่างจาก S₁ 9.0 cm และห่างจาก S₂ 14.0 cm ที่จุด P คลื่นเสริมกันหรือหักล้างกัน</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(S_1P = 9.0\ \text{cm}\), \(S_2P = 14.0\ \text{cm}\), \(\lambda = 2.0\ \text{cm}\) แหล่งกำเนิดเฟสตรงกัน หาว่า P เป็นปฏิบัพหรือบัพ</li>
<li><b>เลือกสมการ:</b> แหล่งเฟสตรงกัน: เสริมเมื่อ \(|S_1P - S_2P| = n\lambda\) หักล้างเมื่อ \(|S_1P - S_2P| = \left(n + \tfrac12\right)\lambda\) จึงต้องดูว่าผลต่างระยะทางเป็นกี่เท่าของ \(\lambda\)</li>
<li><b>แทนค่า:</b> \(|S_1P - S_2P| = 14.0 - 9.0 = 5.0\ \text{cm}\) และ \(\dfrac{5.0}{2.0} = 2.5\) จึงได้ \(5.0\ \text{cm} = \left(2 + \tfrac12\right)\lambda\)</li>
<li><b>ตีความ:</b> ผลต่างเป็นจำนวนเต็มบวกครึ่งของ \(\lambda\) คลื่นจากสองแหล่งมาถึงด้วยเฟสตรงข้าม (ยอดพบท้อง) จึง<strong>หักล้างกัน</strong> P อยู่บนแนวบัพที่ \(n = 2\) (เส้นที่สามนับจากแนวกลาง) ถ้า \(S_2P\) เป็น 13.0 cm ผลต่างจะเป็น \(2\lambda\) และ P จะเสริมกัน</li>
</ol></div>
<p><a class="try" href="#waves-sim">ดูแนวบัพบนผิวน้ำสามมิติในการจำลอง →</a></p>

<h2 id="s3"><span class="num">3</span>การสะท้อน การหักเห และการเลี้ยวเบน</h2>
<div class="eq">\[ \theta_i = \theta_r, \qquad n = \frac{c}{v}, \qquad n_1\sin\theta_1 = n_2\sin\theta_2, \qquad \sin\theta_c = \frac{n_2}{n_1}\;(n_1 > n_2) \]</div>
<ul>
  <li>เมื่อคลื่นผ่านรอยต่อตัวกลาง ความถี่คงเดิม แต่อัตราเร็วและความยาวคลื่นเปลี่ยน \(\lambda_n = \lambda_0 / n\)</li>
  <li>การหักเหใช้ได้กับคลื่นทุกชนิด (แสง เสียง คลื่นน้ำ): \(\dfrac{\sin\theta_1}{\sin\theta_2} = \dfrac{v_1}{v_2} = \dfrac{\lambda_1}{\lambda_2}\) เพราะหน้าคลื่นทั้งสองฝั่งต้องต่อกันพอดีที่รอยต่อ ในหนึ่งคาบหน้าคลื่นเลื่อนไป \(\lambda_1\) และ \(\lambda_2\) ซึ่งเป็นสัดส่วนกับอัตราเร็ว (ความถี่เท่าเดิม) สำหรับแสง แทน \(v = c/n\) ก็ได้กฎของสเนลล์</li>
  <li>ถ้าแสงเดินทางจากตัวกลางที่ \(n\) มากไปยัง \(n\) น้อย ด้วยมุมตกกระทบเกินมุมวิกฤต จะ<strong>สะท้อนกลับหมด</strong> เป็นหลักการของเส้นใยนำแสง</li>
  <li>คลื่นเลี้ยวเบนอ้อมสิ่งกีดขวางได้ชัดเมื่อช่องเปิดมีขนาดใกล้เคียงความยาวคลื่น เราจึงได้ยินเสียงอ้อมมุมตึกแต่มองไม่เห็นแสงอ้อมมุม</li>
</ul>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> แสงเปลี่ยนสีเมื่อเข้าไปในน้ำ เพราะความยาวคลื่นสั้นลง</p>
<p class="ok"><b>ที่ถูกต้อง:</b> สีที่ตารับรู้ผูกกับความถี่ ซึ่งไม่เปลี่ยนเมื่อแสงผ่านรอยต่อ ความยาวคลื่นในน้ำสั้นลงจริง แต่ความถี่และสีเท่าเดิม</p></div>

<div class="wx"><div class="wx-q">แสงเลเซอร์ความยาวคลื่น 633 nm (ในอากาศ) ตกกระทบผิวน้ำ (n = 1.33) ด้วยมุมตกกระทบ 40° แสงในน้ำทำมุมหักเหเท่าใด และมีความยาวคลื่นเท่าใด</div>

<li><b>เลือกสมการ:</b> กฎของสเนลล์ \(n_1\sin\theta_1 = n_2\sin\theta_2\) และเมื่อผ่านรอยต่อ ความถี่คงเดิม ความยาวคลื่นเปลี่ยนเป็น \(\lambda_n = \lambda_0/n\)</li>
<li><b>แทนค่า:</b> \(\sin\theta_2 = \dfrac{1.00 \times \sin 40^\circ}{1.33}\) \(= \dfrac{0.643}{1.33} = 0.483\) จึงได้ \(\theta_2 \approx 28.9^\circ\) และ \(\lambda_n = \dfrac{633}{1.33}\) \(\approx 476\ \text{nm}\)</li>

</ol></div>

<h2 id="s4"><span class="num">4</span>แสงเป็นคลื่น: การแทรกสอดของแสง</h2>
<p>โทมัส ยัง (ราวปี 1801) ฉายแสงผ่านสลิตคู่แล้วได้แถบสว่างสลับมืด เป็นหลักฐานว่าแสงเป็นคลื่น</p>
<div class="eq">\[ d\sin\theta = n\lambda, \qquad d\sin\theta = \left(n+\tfrac12\right)\lambda, \qquad \Delta y \approx \frac{\lambda L}{d} \]</div>
<p>สมการแรกให้ตำแหน่งแถบสว่าง สมการที่สองให้แถบมืด และ \(\Delta y\) คือระยะระหว่างแถบสว่างที่ติดกันบนฉากที่ห่าง \(L\)</p>
<p>เกรตติงที่มีช่องจำนวนมากใช้สูตร \(d\sin\theta = n\lambda\) เดียวกัน แต่ให้แถบสว่างที่คมกว่า จึงใช้วัดความยาวคลื่นของเส้นสเปกตรัมในบทฟิสิกส์อะตอมได้แม่นยำ</p>
<div class="wx"><div class="wx-q">ฉายแสงความยาวคลื่น 600 nm ผ่านสลิตคู่ที่ห่างกัน 0.20 mm ไปยังฉากที่ห่างจากสลิต 1.0 m แถบสว่างที่อยู่ติดกันห่างกันเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(\lambda = 600\ \text{nm} = 600\times10^{-9}\ \text{m}\), \(d = 0.20\ \text{mm} = 0.20\times10^{-3}\ \text{m}\), \(L = 1.0\ \text{m}\) หาระยะระหว่างแถบสว่างที่ติดกัน \(\Delta y\)</li>
<li><b>เลือกสมการ:</b> แถบสว่าง \(d\sin\theta = n\lambda\) เมื่อมุมเล็ก \(\sin\theta \approx y/L\) แถบที่ติดกันจึงห่างกัน \(\Delta y \approx \dfrac{\lambda L}{d}\)</li>
<li><b>แทนค่า:</b> \(\Delta y = \dfrac{(600\times10^{-9})(1.0)}{0.20\times10^{-3}}\) \(= 3.0\times10^{-3}\ \text{m}\) หรือ 3.0 mm</li>
<li><b>ตรวจคำตอบ:</b> หน่วย \(\dfrac{\text{m}\cdot\text{m}}{\text{m}} = \text{m}\) ✓ แถบห่างกันไม่กี่มิลลิเมตร มองเห็นได้ด้วยตา มุมคือ \(3.0\times10^{-3}/1.0\) rad ซึ่งเล็กมาก จึงใช้การประมาณมุมเล็กได้ ถ้าลืมแปลง mm เป็นเมตร คำตอบจะผิดไป 1000 เท่า และถ้าลืมแปลง nm จะผิดไปพันล้านเท่า (\(10^9\))</li>
</ol></div>

<div class="eq">\[ \frac1f = \frac1u + \frac1v, \qquad m = \frac{v}{u}, \qquad f_{\text{mirror}} = \frac{R}{2} \]</div>
<p>ใช้ข้อตกลงว่า ระยะภาพจริงเป็นบวก ระยะภาพเสมือนเป็นลบ เลนส์นูนมี \(f\) เป็นบวก เลนส์เว้ามี \(f\) เป็นลบ</p>

<p class="lead">หวีที่ถูกับผมแล้วดูดเศษกระดาษได้ เพราะแรงระหว่างประจุไฟฟ้าที่อยู่นิ่ง ส่วนประกายไฟเมื่อจับลูกบิดประตูและฟ้าผ่า เกิดจากประจุที่สะสมอยู่นิ่ง ๆ จนมากพอแล้วไหลออกอย่างรวดเร็ว บทนี้เริ่มจากประจุ ไปสู่แรง สนาม ศักย์ และตัวเก็บประจุ ซึ่งเป็นพื้นฐานของบทอนุภาคในสนามแม่เหล็กและบทฟิสิกส์อะตอม</p>

<h2 id="s1"><span class="num">1</span>ประจุไฟฟ้า</h2>
<p>สสารทุกชนิดประกอบด้วยอะตอม ในนิวเคลียสมีโปรตอนซึ่งมีประจุบวก และรอบนิวเคลียสมีอิเล็กตรอนซึ่งมีประจุลบ</p>
<ul>
  <li><strong>ประจุมีสองชนิด:</strong> บวกและลบ ประจุชนิดเดียวกันผลักกัน ประจุต่างชนิดดูดกัน</li>
  <li><strong>หน่วย:</strong> คูลอมบ์ (C) ซึ่งเป็นประจุที่ใหญ่มาก ในชีวิตประจำวันเจอแค่ระดับไมโครคูลอมบ์ \(1\ \mu\text{C} = 10^{-6}\ \text{C}\) หรือนาโนคูลอมบ์ \(1\ \text{nC} = 10^{-9}\ \text{C}\)</li>
  <li><strong>ประจุมูลฐาน:</strong> โปรตอนมีประจุ \(+e\) อิเล็กตรอนมีประจุ \(-e\) โดย \(e = 1.6\times10^{-19}\ \text{C}\) ประจุของวัตถุใด ๆ เป็นจำนวนเต็มเท่าของ \(e\) เสมอ</li>
  <li><strong>วัตถุที่เป็นกลาง</strong> มีโปรตอนกับอิเล็กตรอนเท่ากัน วัตถุมีประจุลบเมื่อได้อิเล็กตรอนเพิ่ม และมีประจุบวกเมื่อเสียอิเล็กตรอนไป โปรตอนติดอยู่ในนิวเคลียส ไม่ได้ย้ายไปไหน</li>
</ul>
<div class="eq">\[ q = ne \]</div>
<p>\(n\) คือจำนวนอิเล็กตรอนที่เกินหรือขาด (จำนวนเต็ม) และ<strong>กฎอนุรักษ์ประจุ</strong>บอกว่า ประจุไม่เกิดขึ้นใหม่และไม่สูญหาย มีแต่ย้ายจากที่หนึ่งไปอีกที่หนึ่ง ประจุรวมของระบบโดดเดี่ยวจึงคงที่เสมอ</p>
<p><strong>ตัวนำ</strong> เช่น โลหะ มีอิเล็กตรอนอิสระที่เคลื่อนที่ไปทั่วเนื้อวัตถุได้ ส่วน<strong>ฉนวน</strong> เช่น พลาสติก แก้ว ยาง อิเล็กตรอนถูกยึดไว้กับอะตอม ประจุที่ได้มาจึงค้างอยู่ตรงจุดเดิม การทำให้วัตถุมีประจุทำได้สามวิธี</p>
<div class="tbl-scroll"><table class="tbl">
<tr><th>วิธี</th><th>เกิดอะไรขึ้น</th><th>ผลที่ได้</th></tr>
<tr><td>ขัดสี</td><td>ถูวัตถุสองชนิดกัน อิเล็กตรอนย้ายจากผิววัตถุหนึ่งไปอีกวัตถุหนึ่ง</td><td>มีประจุ<em>ต่างชนิด</em> ขนาดเท่ากัน</td></tr>
<tr><td>สัมผัส</td><td>วัตถุมีประจุแตะตัวนำ อิเล็กตรอนไหลจนประจุกระจายอยู่บนทั้งสอง</td><td>มีประจุ<em>ชนิดเดียวกัน</em></td></tr>
<tr><td>เหนี่ยวนำ</td><td>นำวัตถุมีประจุเข้าใกล้ตัวนำโดยไม่แตะ ต่อสายดิน แล้วตัดสายดินก่อนนำวัตถุออก</td><td>ตัวนำมีประจุ<em>ตรงข้าม</em>กับวัตถุ</td></tr>
</table></div>
<p>ทรงกลมโลหะที่เหมือนกันทุกประการ เมื่อแตะกันแล้วแยกออก จะแบ่งประจุรวมกันคนละครึ่ง</p>
<div class="eq">\[ q_1' = q_2' = \frac{q_1 + q_2}{2} \]</div>
<p><strong>อิเล็กโทรสโคป</strong> ใช้ตรวจประจุ: แผ่นโลหะบางสองแผ่นห้อยจากแกนโลหะ เมื่อมีประจุชนิดเดียวกันจะผลักกันและกางออก แค่นำวัตถุมีประจุเข้าใกล้ปุ่มด้านบนโดยไม่แตะ แผ่นก็กางได้ เพราะการเหนี่ยวนำทำให้แผ่นมีประจุชนิดเดียวกับวัตถุ: แท่งลบผลักอิเล็กตรอนลงไปที่แผ่น (แผ่นเป็นลบ) แท่งบวกดึงอิเล็กตรอนขึ้นไปที่ปุ่ม แผ่นจึงขาดอิเล็กตรอน (เป็นบวก) แต่ประจุรวมของอิเล็กโทรสโคปยังเป็นศูนย์ พอนำวัตถุออก แผ่นก็หุบ</p>

<h2 id="s2"><span class="num">2</span>กฎของคูลอมบ์</h2>
<p>ชาร์ล-โอกุสแต็ง เดอ คูลอมบ์ (ค.ศ. 1785) วัดแรงระหว่างทรงกลมเล็ก ๆ ที่มีประจุ พบว่าแรงแปรผันตรงกับผลคูณของประจุ และแปรผกผันกับกำลังสองของระยะห่าง</p>
<div class="eq">\[ F = \frac{k\,|q_1 q_2|}{r^2} \]\[ k = 9.0\times10^{9}\ \text{N·m}^2/\text{C}^2 \]</div>
<p>สูตรนี้ให้เฉพาะ<em>ขนาด</em> ใช้กับประจุจุด (ขนาดเล็กมากเมื่อเทียบกับระยะห่าง) ส่วนทิศอยู่บนเส้นที่ต่อสองประจุ ชนิดเดียวกันผลักออก ต่างชนิดดูดเข้า บางเล่มเขียน \(k = \dfrac{1}{4\pi\varepsilon_0}\) โดย \(\varepsilon_0 = 8.85\times10^{-12}\ \text{C}^2/(\text{N·m}^2)\) คือสภาพยอมของสุญญากาศ ซึ่งจะได้ใช้อีกครั้งในหัวข้อตัวเก็บประจุ</p>
<ul>
  <li><strong>ระยะห่างสำคัญมาก:</strong> ห่างขึ้น 2 เท่า แรงเหลือ \(\tfrac14\) ห่างขึ้น 3 เท่า แรงเหลือ \(\tfrac19\)</li>
  <li><strong>แรงคู่กิริยา–ปฏิกิริยา:</strong> แรงที่ \(q_1\) กระทำต่อ \(q_2\) กับแรงที่ \(q_2\) กระทำต่อ \(q_1\) มีขนาดเท่ากันและทิศตรงข้ามเสมอ (กฎข้อที่สามของนิวตัน)</li>
  <li><strong>หลายประจุ:</strong> หาแรงจากแต่ละประจุแยกกันทีละคู่ เหมือนไม่มีประจุอื่นอยู่ แล้วรวมแบบ<em>เวกเตอร์</em> บนเส้นตรง ให้กำหนดทิศบวกก่อน แล้วตัดสินทิศของแต่ละแรงจาก “ผลักหรือดูด” (ไม่ใช่จากเครื่องหมายของ \(q\)) ถ้าแรงตั้งฉากกัน ใช้ทฤษฎีบทพีทาโกรัส</li>
</ul>
<p><strong>แรงไฟฟ้าเทียบกับแรงโน้มถ่วง:</strong> ระหว่างโปรตอนกับอิเล็กตรอน อัตราส่วน \(F_e/F_g = \dfrac{ke^2}{Gm_em_p} \approx 2.3\times10^{39}\) (ใช้ \(G = 6.67\times10^{-11}\ \text{N·m}^2/\text{kg}^2\) ระยะห่างตัดกันหมด) แรงไฟฟ้าแรงกว่ามหาศาล แต่ในชีวิตประจำวันเราไม่ค่อยรู้สึก เพราะสสารเกือบทั้งหมดเป็นกลาง แรงจากประจุบวกและลบหักล้างกัน ส่วนแรงโน้มถ่วงมีแต่ดูด จึงสะสมจนเด่นในวัตถุขนาดดาวเคราะห์</p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ประจุ 10 µC ออกแรงต่อประจุ 1 µC มากกว่าที่ประจุ 1 µC ออกแรงกลับ</p>
<p class="ok"><b>ที่ถูกต้อง:</b> ทั้งสองแรงมีขนาดเท่ากัน \(k|q_1q_2|/r^2\) เพราะสูตรใช้ผลคูณ \(q_1q_2\) ซึ่งเหมือนกันทั้งสองฝั่ง และเป็นไปตามกฎข้อที่สามของนิวตัน สิ่งที่ต่างคือความเร่ง ถ้ามวลไม่เท่ากัน</p></div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>

<p class="ok"><b>ที่ถูกต้อง:</b> แรงแปรผกผันกับ \(r^2\) จึงเหลือ \(\tfrac14\) ลืมยกกำลังสองเป็นความผิดที่พบบ่อยที่สุดของกฎนี้ และอย่าลืมแปลง cm เป็น m ก่อนยกกำลัง</p></div>
<div class="wx"><div class="wx-q">ประจุ \(q_0 = +2.0\ \mu\text{C}\) อยู่ที่มุมฉากของสามเหลี่ยมมุมฉาก ห่างไปทางทิศตะวันออก 30 cm มีประจุ \(+4.5\ \mu\text{C}\) และห่างไปทางทิศเหนือ 30 cm มีประจุ \(-6.0\ \mu\text{C}\) แรงลัพธ์ที่กระทำต่อ \(q_0\) มีขนาดและทิศอย่างไร (\(k = 9.0\times10^9\ \text{N·m}^2/\text{C}^2\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(q_0 = 2.0\times10^{-6}\ \text{C}\), \(q_1 = +4.5\times10^{-6}\ \text{C}\) (ตะวันออก), \(q_2 = -6.0\times10^{-6}\ \text{C}\) (เหนือ) ระยะ \(r = 0.30\ \text{m}\) ทั้งคู่ หาแรงลัพธ์บน \(q_0\)</li>
<li><b>เลือกสมการ:</b> หาขนาดทีละคู่ด้วย \(F = \dfrac{k|q_1q_2|}{r^2}\) ตัดสินทิศจากผลักหรือดูด: \(q_1\) บวกเหมือน \(q_0\) จึงผลัก \(q_0\) ไปทางตะวันตก \(q_2\) เป็นลบจึงดูด \(q_0\) ไปทางเหนือ สองแรงตั้งฉากกัน รวมด้วย \(F = \sqrt{F_1^2 + F_2^2}\)</li>
<li><b>แทนค่า:</b> ระยะเท่ากันทั้งคู่ จึงคิดส่วนที่ซ้ำกันก่อน \(\dfrac{kq_0}{r^2} = \dfrac{(9.0\times10^9)(2.0\times10^{-6})}{(0.30)^2}\) \(= 2.0\times10^5\ \text{N/C}\) (หน่วยนี้จะได้พบอีกในหัวข้อสนามไฟฟ้า) แล้ว \(F_1 = (2.0\times10^5)(4.5\times10^{-6})\) \(= 0.90\ \text{N}\) และ \(F_2 = (2.0\times10^5)(6.0\times10^{-6})\) \(= 1.2\ \text{N}\) จึงได้ \(F = \sqrt{0.90^2 + 1.2^2}\) \(= 1.5\ \text{N}\) และ \(\tan\theta = \dfrac{1.2}{0.90}\) ได้ \(\theta \approx 53^\circ\)</li>
<li><b>ตีความ:</b> แรงลัพธ์ 1.5 N ชี้ไปทางตะวันตกเฉียงเหนือ ทำมุมราว 53° จากทิศตะวันตกไปทางเหนือ คำตอบมากกว่าแรงแต่ละแรง แต่น้อยกว่าผลบวก 2.1 N ✓ ถ้าใช้ \(r = 30\) (cm) จะได้แรงเล็กไป \(10^4\) เท่า และถ้าเอาเครื่องหมายลบของ \(q_2\) ไปเป็นทิศ “ลบ” โดยไม่คิดว่าดูดหรือผลัก ทิศจะผิด</li>
</ol></div>

<h2 id="s3"><span class="num">3</span>สนามไฟฟ้า</h2>
<p>ประจุออกแรงต่อกันได้ทั้งที่ไม่ได้แตะกัน เราอธิบายว่าประจุแต่ละตัวสร้าง<strong>สนามไฟฟ้า</strong>ไว้รอบตัว ประจุอื่นที่อยู่ในสนามจะถูกแรง วัดสนามที่จุดหนึ่งได้โดยวาง<strong>ประจุทดสอบ</strong> \(q\) ซึ่งเป็นประจุบวกขนาดเล็กมากจนไม่รบกวนประจุต้นกำเนิด แล้วดูว่าถูกแรงเท่าใดต่อหนึ่งหน่วยประจุ</p>
<div class="eq">\[ \vec E = \frac{\vec F}{q} \]\[ \vec F = q\vec E \]</div>
<p>สนามมีหน่วย N/C และเป็นเวกเตอร์ ทิศของ \(\vec E\) คือทิศของแรงที่กระทำต่อประจุ<em>บวก</em> ประจุลบถูกแรงในทิศตรงข้ามกับ \(\vec E\) สนามจากจุดประจุ \(Q\) ที่ระยะ \(r\) ได้จากกฎของคูลอมบ์หารด้วย \(q\)</p>
<div class="eq">\[ E = \frac{k\,|Q|}{r^2} \]</div>
<p>สนามชี้ออกจาก \(Q\) ถ้า \(Q\) เป็นบวก และชี้เข้าหา \(Q\) ถ้า \(Q\) เป็นลบ ถ้ามีหลายประจุ ให้หาสนามจากแต่ละตัวแล้วรวมแบบเวกเตอร์ เหมือนการรวมแรงในหัวข้อที่ 2</p>
<p><strong>เส้นสนามไฟฟ้า</strong> เป็นภาพที่ช่วยให้เห็นสนามทั้งบริเวณ</p>
<ul>
  <li>เริ่มที่ประจุบวก และจบที่ประจุลบ (หรือวิ่งออกไปไกลมาก)</li>
  <li>เส้นสัมผัสของเส้นสนาม ณ จุดใดบอกทิศของ \(\vec E\) ที่จุดนั้น</li>
  <li>เส้นถี่ = สนามแรง เส้นห่าง = สนามอ่อน จำนวนเส้นที่ออกจากประจุแปรตามขนาดของประจุ</li>
  <li>เส้นสนามไม่ตัดกัน เพราะที่จุดหนึ่ง สนามมีได้ทิศเดียว</li>
</ul>
<p><strong>สนามสม่ำเสมอ:</strong> แผ่นโลหะขนานสองแผ่นที่มีประจุ \(+Q\) และ \(-Q\) สร้างสนามที่มีขนาดและทิศเท่ากันทุกจุดในช่องระหว่างแผ่น (ยกเว้นใกล้ขอบ) เส้นสนามเป็นเส้นตรงขนานห่างเท่ากัน ชี้จากแผ่นบวกไปแผ่นลบ</p>
<p><strong>ประจุที่เคลื่อนที่ในสนามสม่ำเสมอ</strong> ถูกแรง \(qE\) คงตัว จึงมีความเร่งคงตัว ใช้สมการการเคลื่อนที่ด้วยความเร่งคงตัวจากบทกลศาสตร์ได้เลย ถ้าประจุวิ่งเข้าไปในแนวตั้งฉากกับสนาม ความเร็วแนวขนานกับแผ่นคงที่ ส่วนแนวสนามถูกเร่ง ทางเดินจึงโค้งเป็นพาราโบลา เหมือนวิถีโปรเจกไทล์ที่ \(g\) ถูกแทนด้วย \(qE/m\) (แรงโน้มถ่วงบนอิเล็กตรอนหรือโปรตอนเล็กมากจนตัดทิ้งได้)</p>
<div class="eq">\[ a = \frac{qE}{m} \]</div>
<p><a class="try" href="#estat-sim">ลองกดฉากไดโพลและแผ่นขนานในการจำลอง แล้วดูเส้นสนามเริ่มที่ + จบที่ − →</a></p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ใช้ประจุทดสอบใหญ่ขึ้น สนามไฟฟ้าก็แรงขึ้น เพราะ \(E = F/q\)</p>
<p class="ok"><b>ที่ถูกต้อง:</b> เพิ่ม \(q\) เป็น 2 เท่า แรง \(F\) ก็เพิ่มเป็น 2 เท่า อัตราส่วน \(F/q\) จึงเท่าเดิม สนามเป็นสมบัติของประจุต้นกำเนิดและตำแหน่ง \((E = k|Q|/r^2)\) มีอยู่แม้ไม่มีประจุทดสอบวางอยู่</p></div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>

<p class="ok"><b>ที่ถูกต้อง:</b> อิเล็กตรอนมีประจุลบ จึงถูกแรงทิศ<em>ตรงข้าม</em>กับ \(\vec E\) และสนามบอกทิศของแรง (ความเร่ง) ไม่ใช่ทิศของความเร็ว ประจุที่มีความเร็วตั้งต้นจึงอาจวิ่งเฉียงหรือโค้งออกจากเส้นสนามได้ เหมือนลูกบอลที่ขว้างออกไปไม่ได้วิ่งตามทิศของแรงโน้มถ่วง</p></div>
<div class="wx"><div class="wx-q">ประจุ \(+4.0\ \mu\text{C}\) และ \(-2.0\ \mu\text{C}\) อยู่ห่างกัน 20 cm สนามไฟฟ้าที่จุดกึ่งกลางมีขนาดและทิศอย่างไร และถ้าวางอิเล็กตรอนที่จุดนั้น จะถูกแรงเท่าใด ทิศใด (\(k = 9.0\times10^9\ \text{N·m}^2/\text{C}^2\), \(e = 1.6\times10^{-19}\ \text{C}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(Q_1 = +4.0\times10^{-6}\ \text{C}\), \(Q_2 = -2.0\times10^{-6}\ \text{C}\) จุดกึ่งกลางห่างจากแต่ละประจุ \(r = 0.10\ \text{m}\) หา \(\vec E\) ที่จุดนั้น และแรงบนอิเล็กตรอน</li>

<h2 id="s4"><span class="num">4</span>ศักย์และความต่างศักย์</h2>
<p>ยกก้อนหินขึ้นสูง เราต้องทำงานสู้แรงโน้มถ่วง และงานนั้นเก็บไว้เป็นพลังงานศักย์ ปล่อยมือ หินตกลงและพลังงานศักย์กลายเป็นพลังงานจลน์ ไฟฟ้าก็เหมือนกัน: ดันประจุบวกสวนทิศสนาม ต้องทำงาน และ<strong>พลังงานศักย์ไฟฟ้า</strong> \(E_p\) ของประจุเพิ่มขึ้น</p>
<p><strong>ศักย์ไฟฟ้า</strong> \(V\) ที่จุดหนึ่ง คือพลังงานศักย์ไฟฟ้าต่อหนึ่งหน่วยประจุ หรือต่อหนึ่งหน่วยประจุของงาน \(W\) ที่<em>เรา</em>ต้องทำ (สู้แรงไฟฟ้า) ในการนำประจุบวก \(q\) จากที่ไกลมาก (ซึ่งกำหนดให้ศักย์เป็นศูนย์) มาวางที่จุดนั้นอย่างช้า ๆ หน่วยคือโวลต์ \(1\ \text{V} = 1\ \text{J/C}\)</p>
<div class="eq">\[ V = \frac{W}{q} \]\[ E_p = qV \]</div>
<p>ศักย์จากจุดประจุ \(Q\) ที่ระยะ \(r\) ใส่เครื่องหมายของ \(Q\) ด้วย (ใกล้ประจุบวก \(V\) เป็นบวก ใกล้ประจุลบ \(V\) เป็นลบ) ศักย์เป็น<strong>ปริมาณสเกลาร์</strong> ไม่มีทิศ ถ้ามีหลายประจุ ให้บวกแบบพีชคณิตธรรมดา</p>
<div class="eq">\[ V = \frac{kQ}{r} \]\[ V = V_1 + V_2 + \cdots \]</div>
<p><strong>ความต่างศักย์</strong> ระหว่างจุด A กับ B คือ \(V_{AB} = V_A - V_B\) เมื่อประจุ \(q\) เคลื่อนที่จาก A ไป B <em>แรงไฟฟ้า</em>ทำงาน \(W_{A\to B}\) ตามสมการข้างล่าง ส่วนงานที่เราทำเมื่อย้ายประจุอย่างช้า ๆ มีขนาดเท่ากันแต่เครื่องหมายตรงข้าม: งานที่เราทำ \(=\) − งานของแรงไฟฟ้า</p>
<div class="eq">\[ W_{A\to B} = q\,(V_A - V_B) \]</div>
<p>ในสนามสม่ำเสมอ ความต่างศักย์ \(V\) ระหว่างสองจุดที่ห่างกัน \(d\) ในแนวสนามสัมพันธ์กับสนามดังนี้ (ในสูตรนี้ \(V\) คือความต่างศักย์ ไม่ใช่ศักย์ที่จุดใดจุดหนึ่ง) (หน่วย V/m เท่ากับ N/C) เช่น แผ่นขนานห่างกัน 2.0 cm ที่มีความต่างศักย์ 100 V มีสนาม 5000 V/m</p>
<div class="eq">\[ E = \frac{V}{d} \]</div>
<ul>
  <li>สนามไฟฟ้าชี้จากที่ศักย์สูงไปที่ศักย์ต่ำเสมอ</li>
  <li><strong>ผิวศักย์เท่า</strong> คือผิวที่ทุกจุดมีศักย์เท่ากัน ตั้งฉากกับเส้นสนามทุกจุด ย้ายประจุไปตามผิวศักย์เท่า แรงไฟฟ้าไม่ทำงาน ถ้าวาดผิวศักย์เท่าห่างกันทีละ \(\Delta V\) เท่ากัน บริเวณที่ผิวชิดกันคือบริเวณที่สนามแรง</li>
</ul>
<p><strong>การเร่งประจุด้วยความต่างศักย์:</strong> ถ้าแรงไฟฟ้าเป็นแรงเดียวที่ทำงาน งานทั้งหมดกลายเป็นพลังงานจลน์ที่เพิ่มขึ้น ประจุ \(q\) ที่เคลื่อนที่ผ่านความต่างศักย์ \(V = V_A - V_B\) จึงได้</p>
<div class="eq">\[ \Delta E_k = qV \]</div>
<p>ในสูตรนี้ \(V\) คือความต่างศักย์ระหว่างจุดเริ่มกับจุดปลาย ไม่ใช่ศักย์ที่จุดใดจุดหนึ่ง</p>
<p>ประจุบวกเร่งขึ้นเมื่อไปหาศักย์ต่ำ ประจุลบ (เช่น อิเล็กตรอน) เร่งขึ้นเมื่อไปหาศักย์สูง ถ้าเริ่มจากหยุดนิ่งและเร่งผ่านความต่างศักย์ขนาด \(V\) จะได้ \(\tfrac12 mv^2 = |q|V\)</p>
<p>พลังงานระดับอะตอมเล็กมากเมื่อวัดเป็นจูล จึงนิยมใช้หน่วย <strong>อิเล็กตรอนโวลต์</strong> (eV): พลังงานที่อนุภาคประจุ \(e\) ได้เมื่อเร่งผ่านความต่างศักย์ 1 V</p>
<div class="eq">\[ 1\ \text{eV} = 1.6\times10^{-19}\ \text{J} \]</div>
<p>หลักเดียวกันนี้ใช้กลับทางในบทฟิสิกส์อะตอม: ความต่างศักย์หยุดยั้ง \(V_s\) ในปรากฏการณ์โฟโตอิเล็กทริกหยุดอิเล็กตรอนที่มีพลังงานจลน์ \(eV_s\) ได้พอดี</p>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
คิดว่าศักย์คือ “ความสูง” ของภูมิประเทศสำหรับประจุบวก ประจุบวกกลิ้งจากเนินสูงลงที่ต่ำเองได้ เหมือนลูกบอล ประจุบวกตั้งยอดเนิน ประจุลบขุดหลุม เส้นศักย์เท่าคือเส้นชั้นความสูงบนแผนที่ และสนามไฟฟ้าชี้ไปทางลาดลงที่ชันที่สุด ส่วนอิเล็กตรอนเหมือนฟองอากาศในน้ำ ลอย “ขึ้น” ไปหาที่ศักย์สูง</div>
<p><a class="try" href="#estat-sim">ลองวัดค่าที่กึ่งกลางไดโพลในการจำลอง: V ≈ 0 แต่ |E| ไม่เป็นศูนย์ →</a></p>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>

<p class="ok"><b>ที่ถูกต้อง:</b> สนามบอกว่าศักย์<em>เปลี่ยน</em>เร็วแค่ไหน ไม่ใช่ศักย์มีค่าเท่าไร กึ่งกลางของประจุ \(+q\) กับ \(-q\) มี \(V = 0\) (บวกแบบสเกลาร์หักล้างกัน) แต่สนามไม่เป็นศูนย์ (เวกเตอร์ชี้ทางเดียวกัน) กลับกัน กึ่งกลางของ \(+q\) กับ \(+q\) มีสนามเป็นศูนย์ แต่ศักย์เป็นบวก อย่ารวมศักย์แบบเวกเตอร์ และอย่ารวมสนามแบบสเกลาร์</p></div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>

<p class="ok"><b>ที่ถูกต้อง:</b> ขึ้นกับเครื่องหมายของประจุ ถ้าบังคับให้อิเล็กตรอนเคลื่อนที่ไปตามทิศ \(\vec E\) (ไปหาศักย์ต่ำ) แรงไฟฟ้าทำงาน<em>ลบ</em> และพลังงานศักย์ของมันเพิ่มขึ้น ใช้ \(W_{A\to B} = q(V_A - V_B)\) (งานของแรงไฟฟ้า) โดยแทน \(q = -e\) พร้อมเครื่องหมาย แล้วเครื่องหมายของงานจะออกมาถูกเอง</p></div>

</ol></div>

<h2 id="s5"><span class="num">5</span>ตัวเก็บประจุ</h2>
<p><strong>ตัวเก็บประจุ</strong> คือตัวนำสองชิ้นที่วางใกล้กันโดยมีฉนวนคั่น การชาร์จคือการย้ายอิเล็กตรอนจากแผ่นหนึ่งไปอีกแผ่นหนึ่ง แผ่นหนึ่งจึงมีประจุ \(+Q\) อีกแผ่นมี \(-Q\) และมีความต่างศักย์ \(V\) ระหว่างแผ่น ประจุ \(Q\) ที่แผ่นบวกแปรผันตรงกับ \(V\) อัตราส่วนนี้คือ<strong>ความจุ</strong></p>
<div class="eq">\[ C = \frac{Q}{V} \]</div>
<p>หน่วยฟารัด \(1\ \text{F} = 1\ \text{C/V}\) ซึ่งใหญ่มาก ตัวเก็บประจุทั่วไปมีความจุระดับไมโครฟารัด (µF) นาโนฟารัด (nF) หรือพิโกฟารัด (pF, \(10^{-12}\ \text{F}\)) สำหรับแผ่นโลหะขนานพื้นที่ \(A\) ห่างกัน \(d\) ในอากาศหรือสุญญากาศ</p>
<div class="eq">\[ C = \frac{\varepsilon_0 A}{d} \]</div>
<p>\(\varepsilon_0 = 8.85\times10^{-12}\ \text{C}^2/(\text{N·m}^2)\) (ตัวเดียวกับใน \(k = 1/4\pi\varepsilon_0\)) ถ้าแผ่นใหญ่ขึ้น ประจุเท่าเดิมกระจายบางลง สนามระหว่างแผ่นจึงอ่อนลง ถ้าแผ่นชิดขึ้น ระยะ \(d\) ในสูตร \(V = Ed\) สั้นลง ทั้งสองแบบทำให้ประจุเท่าเดิมมีความต่างศักย์น้อยลง \(C = Q/V\) จึงมากขึ้น ความจุขึ้นกับรูปร่างและขนาด ไม่ได้ขึ้นกับ \(Q\) หรือ \(V\)</p>
<p><strong>พลังงานสะสม:</strong> ตอนเริ่มชาร์จ แผ่นยังไม่มีความต่างศักย์ ย้ายประจุได้ง่าย ยิ่งชาร์จ ความต่างศักย์ยิ่งสูง ย้ายประจุยิ่งยาก โดยเฉลี่ยประจุทั้งหมดถูกย้ายผ่านความต่างศักย์ \(V/2\) (พื้นที่ใต้กราฟ \(Q\)–\(V\) ซึ่งเป็นสามเหลี่ยม) จึงได้</p>
<div class="eq">\[ U = \tfrac12 QV \]\[ U = \tfrac12 CV^2 \]\[ U = \frac{Q^2}{2C} \]</div>
<p>ทั้งสามแบบเป็นสูตรเดียวกัน แค่แทน \(Q = CV\) เลือกใช้ตามค่าที่โจทย์ให้ พลังงานนี้ใช้ในแฟลชกล้องและเครื่องกระตุกหัวใจ</p>
<p><strong>การต่อตัวเก็บประจุ</strong></p>
<div class="tbl-scroll"><table class="tbl">
<tr><th></th><th>ต่ออนุกรม</th><th>ต่อขนาน</th></tr>
<tr><td>สิ่งที่เท่ากัน</td><td>\(Q\) ทุกตัว</td><td>\(V\) ทุกตัว</td></tr>
<tr><td>สิ่งที่รวมกัน</td><td>\(V = V_1 + V_2\)</td><td>\(Q = Q_1 + Q_2\)</td></tr>
<tr><td>ความจุรวม</td><td>\(\dfrac1C = \dfrac1{C_1} + \dfrac1{C_2}\)</td><td>\(C = C_1 + C_2\)</td></tr>
</table></div>
<ul>
  <li><strong>อนุกรม:</strong> แผ่นที่อยู่ตรงกลางสองแผ่นต่อถึงกันและแยกโดดเดี่ยวจากที่อื่น ประจุรวมของมันเป็นศูนย์ตลอด ถ้าแผ่นหนึ่งมี \(-Q\) อีกแผ่นต้องมี \(+Q\) ทุกตัวจึงมีประจุเท่ากัน ความต่างศักย์แบ่งกัน ความจุรวมจึง<em>น้อยกว่า</em>ตัวที่น้อยที่สุด</li>
  <li><strong>ขนาน:</strong> แผ่นที่ต่อสายถึงกันเป็นตัวนำชิ้นเดียว มีศักย์เท่ากัน ทุกตัวจึงมีความต่างศักย์เท่ากัน ประจุรวมกัน เหมือนแผ่นใหญ่ขึ้น ความจุรวมจึง<em>มากกว่า</em>ทุกตัว</li>
</ul>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
ตัวเก็บประจุไม่ได้ “เติม” ประจุเข้าไป แต่ “แยก” ประจุ เหมือนสูบน้ำจากถังหนึ่งไปอีกถังที่ต่อกันด้วยท่อปิด น้ำรวมเท่าเดิม แต่ระดับน้ำต่างกัน และพลังงานอยู่ที่ความต่างระดับนั้น ยิ่งสูบ ระดับยิ่งต่าง ยิ่งสูบยาก นี่คือที่มาของ \(\tfrac12\) ในสูตรพลังงาน</div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> ตัวเก็บประจุที่ชาร์จแล้วมีประจุสุทธิ \(Q\)</p>
<p class="ok"><b>ที่ถูกต้อง:</b> แผ่นหนึ่งมี \(+Q\) อีกแผ่นมี \(-Q\) ประจุสุทธิของทั้งตัวเป็นศูนย์ \(Q\) ในสูตร \(C = Q/V\) คือขนาดของประจุบนแผ่นใดแผ่นหนึ่ง สิ่งที่ตัวเก็บประจุเก็บจริง ๆ คือพลังงานจากการแยกประจุ</p></div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>ข้อควรระวัง:</b> จำสูตรอนุกรมและขนานสลับกัน โดยเฉพาะถ้าเคยเห็นสูตรของตัวต้านทาน (ซึ่งจะเรียนในบทไฟฟ้ากระแส)</p>
<p class="ok"><b>ที่ถูกต้อง:</b> ของตัวเก็บประจุ ขนาน <em>บวกกันตรง ๆ</em> อนุกรมบวกกันแบบส่วนกลับ ซึ่งกลับกันกับตัวต้านทาน อย่าท่องจำ ให้คิดจากเหตุผล: ต่อขนานเหมือนแผ่นใหญ่ขึ้น (\(A\) เพิ่ม) ต่ออนุกรมเหมือนแผ่นห่างขึ้น (\(d\) เพิ่ม)</p></div>
<div class="wx"><div class="wx-q">ตัวเก็บประจุแผ่นขนานในอากาศ แต่ละแผ่นขนาด 10 cm × 20 cm วางห่างกัน 1.0 mm ชาร์จด้วยความต่างศักย์ 100 V มีความจุ ประจุ และพลังงานสะสมเท่าใด (\(\varepsilon_0 = 8.85\times10^{-12}\ \text{C}^2/(\text{N·m}^2)\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(A = (0.10)(0.20) = 0.020\ \text{m}^2\), \(d = 1.0\ \text{mm} = 1.0\times10^{-3}\ \text{m}\), \(V = 100\ \text{V}\) หาความจุ \(C\) ประจุ \(Q\) และพลังงาน \(U\)</li>
<li><b>เลือกสมการ:</b> แผ่นขนาน \(C = \dfrac{\varepsilon_0 A}{d}\) จากนั้น \(Q = CV\) และ \(U = \tfrac12 CV^2\)</li>
<li><b>แทนค่า:</b> \(C = \dfrac{(8.85\times10^{-12})(0.020)}{1.0\times10^{-3}}\) \(= 1.77\times10^{-10}\ \text{F}\) (177 pF) แล้ว \(Q = (1.77\times10^{-10})(100)\) \(= 1.77\times10^{-8}\ \text{C}\) และ \(U = \tfrac12(1.77\times10^{-10})(100)^2\) \(\approx 8.9\times10^{-7}\ \text{J}\)</li>
<li><b>ตรวจคำตอบ:</b> คิดอีกทาง \(U = \tfrac12 QV = \tfrac12(1.77\times10^{-8})(100)\) ได้ค่าเดียวกัน ✓ แผ่นขนาดฝ่ามือมีความจุเพียงราว 177 pF ซึ่งเป็นเหตุผลว่าฟารัดเป็นหน่วยที่ใหญ่มาก ถ้าลืมแปลง mm เป็นเมตร ความจุจะเล็กไป 1000 เท่า แต่ละแผ่นมีประจุ \(\pm1.77\times10^{-8}\ \text{C}\) ประจุสุทธิเป็นศูนย์</li>
</ol></div>
<div class="wx"><div class="wx-q">ตัวเก็บประจุ 3.0 µF และ 6.0 µF ต่ออนุกรมกันกับความต่างศักย์ 12 V ความจุรวม ประจุบนแต่ละตัว และความต่างศักย์คร่อมแต่ละตัวเป็นเท่าใด</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(C_1 = 3.0\ \mu\text{F}\), \(C_2 = 6.0\ \mu\text{F}\) ต่ออนุกรม \(V = 12\ \text{V}\) หา \(C\) รวม \(Q\) ของแต่ละตัว และ \(V_1\), \(V_2\)</li>
<li><b>เลือกสมการ:</b> อนุกรม: ประจุเท่ากันทุกตัว \(\dfrac1C = \dfrac1{C_1} + \dfrac1{C_2}\) แล้ว \(Q = CV\) และ \(V_i = \dfrac{Q}{C_i}\)</li>
<li><b>แทนค่า:</b> \(\dfrac1C = \dfrac13 + \dfrac16 = \dfrac12\) ได้ \(C = 2.0\ \mu\text{F}\) จึงได้ \(Q = (2.0\ \mu\text{F})(12\ \text{V}) = 24\ \mu\text{C}\) บนทั้งสองตัว \(V_1 = \dfrac{24}{3.0} = 8.0\ \text{V}\) และ \(V_2 = \dfrac{24}{6.0} = 4.0\ \text{V}\)</li>
<li><b>ตีความ:</b> \(8.0 + 4.0 = 12\ \text{V}\) ✓ ความจุรวม 2.0 µF น้อยกว่าตัวที่น้อยที่สุด ✓ ตัวที่ความจุ<em>น้อยกว่า</em>รับความต่างศักย์<em>มากกว่า</em> เพราะประจุเท่ากัน ถ้าจำสลับเป็น \(3.0 + 6.0 = 9.0\ \mu\text{F}\) จะได้ประจุ 108 µC ซึ่งผิด (เป็นค่าของการต่อขนาน)</li>
</ol></div>

<p class="lead">อนุภาคที่มีประจุเมื่อวิ่งผ่านสนามแม่เหล็กจะถูก “เลี้ยว” โดยไม่ได้ถูกเร่งให้เร็วขึ้นเลย ความคิดง่าย ๆ ข้อนี้อธิบายได้ตั้งแต่แสงเหนือ เครื่องเร่งอนุภาค ไปจนถึงเครื่องชั่งมวลของอะตอม</p>

<h2 id="s1"><span class="num">1</span>แรงแม่เหล็กบนประจุที่เคลื่อนที่</h2>
<p class="xref">ทบทวนสนามไฟฟ้า → <a href="#estat?s=s3">บทที่ 04 ไฟฟ้าสถิต หัวข้อสนามไฟฟ้า</a></p>
<p>ประจุ \(q\) ที่เคลื่อนที่ด้วยความเร็ว \(\vec v\) ในสนามแม่เหล็ก \(\vec B\) จะถูกแรงกระทำ</p>
<div class="eq">\[ \vec F = q\,\vec v \times \vec B \;\Longrightarrow\; F = qvB\sin\theta \]</div>
<p>\(\theta\) คือมุมระหว่าง \(\vec v\) กับ \(\vec B\) ทิศของแรงหาด้วยกฎมือขวา: ชี้นิ้วทั้งสี่ไปตาม \(\vec v\) แล้วงอนิ้วไปหา \(\vec B\) นิ้วโป้งชี้ทิศ \(\vec F\) สำหรับประจุบวก ถ้าเป็นประจุลบแรงจะกลับทิศ</p>
<ul>
  <li>ประจุอยู่นิ่ง \((v=0)\) → ไม่มีแรงแม่เหล็ก</li>
  <li>เคลื่อนที่ขนานกับสนาม \((\theta = 0^\circ)\) → ไม่มีแรง</li>
  <li>เคลื่อนที่ตั้งฉากกับสนาม \((\theta = 90^\circ)\) → แรงมากที่สุด \(F = qvB\)</li>
</ul>
<div class="wx"><div class="wx-q">อิเล็กตรอนวิ่งในทิศ \(+x\) ด้วยอัตราเร็ว \(3.0\times10^{6}\ \text{m/s}\) ผ่านสนามแม่เหล็กสม่ำเสมอ 0.20 T ที่มีทิศ \(+y\) แรงแม่เหล็กที่กระทำต่ออิเล็กตรอนมีขนาดและทิศอย่างไร (\(e = 1.6\times10^{-19}\ \text{C}\), \(m_e = 9.11\times10^{-31}\ \text{kg}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(q = -e\) (ประจุลบ), \(v = 3.0\times10^{6}\ \text{m/s}\) ทิศ \(+x\), \(B = 0.20\ \text{T}\) ทิศ \(+y\) ความเร็วตั้งฉากกับสนาม \(\theta = 90^\circ\) หาขนาดและทิศของ \(\vec F\)</li>
<li><b>เลือกสมการ:</b> ขนาด \(F = |q|vB\sin\theta\) ส่วนทิศ ใช้กฎมือขวาหาทิศสำหรับประจุบวกก่อน แล้วกลับทิศเพราะอิเล็กตรอนเป็นประจุลบ</li>
<li><b>แทนค่า:</b> \(F = (1.6\times10^{-19})(3.0\times10^{6})\) \(\times (0.20)\sin 90^\circ\) \(= 9.6\times10^{-14}\ \text{N}\) ทิศ: นิ้วทั้งสี่ชี้ \(+x\) งอไปหา \(+y\) นิ้วโป้งชี้ \(+z\) (\(\hat x\times\hat y = \hat z\)) กลับทิศสำหรับอิเล็กตรอน ได้ \(-z\)</li>
<li><b>ตีความ:</b> แรงขนาด \(9.6\times10^{-14}\ \text{N}\) ทิศ \(-z\) ฟังดูน้อย แต่อิเล็กตรอนเบามาก ความเร่ง \(a = F/m_e\) \(\approx 1.1\times10^{17}\ \text{m/s}^2\) ถึงอย่างนั้นอัตราเร็วก็ไม่เปลี่ยน เพราะแรงตั้งฉากกับ \(\vec v\) จึงไม่ทำงาน อิเล็กตรอนแค่เลี้ยว ถ้าลืมกลับทิศสำหรับประจุลบจะตอบ \(+z\) ซึ่งผิด</li>
</ol></div>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
นึกถึงลูกบอลผูกเชือกที่เราแกว่งเป็นวง เชือกดึงลูกบอลเข้าหาศูนย์กลางตลอดเวลา แต่ไม่เคยดึงไปข้างหน้า ลูกบอลจึงเปลี่ยนทิศได้แต่ไม่เร็วขึ้น แรงแม่เหล็กทำงานเหมือนเชือกเส้นนั้น เพราะมันตั้งฉากกับทิศที่อนุภาควิ่งอยู่เสมอ</div>
<div class="check"><div class="tag">ผู้เชี่ยวชาญตรวจทาน</div>
<p class="x"><b>เข้าใจผิด:</b> แรงแม่เหล็กทำให้อนุภาควิ่งเร็วขึ้น</p>
<p class="ok"><b>ที่ถูกต้อง:</b> \(\vec F \perp \vec v\) ตลอดเวลา งานของแรงแม่เหล็กจึงเป็นศูนย์ อัตราเร็วและพลังงานจลน์คงที่ เปลี่ยนแค่ทิศของความเร็ว ถ้าต้องการเพิ่มพลังงานต้องใช้สนามไฟฟ้า</p></div>

<h2 id="s2"><span class="num">2</span>วงกลมในสนามแม่เหล็ก</h2>
<p>ถ้า \(\vec v \perp \vec B\) แรงแม่เหล็กทำหน้าที่เป็นแรงสู่ศูนย์กลาง</p>
<div class="eq">\[ qvB = \frac{mv^2}{r} \;\Longrightarrow\; r = \frac{mv}{qB}, \]\[ T = \frac{2\pi r}{v} = \frac{2\pi m}{qB}, \qquad f = \frac{qB}{2\pi m} \]</div>
<p>สังเกตว่าคาบ \(T\) <strong>ไม่ขึ้นกับอัตราเร็ว</strong> อนุภาคที่เร็วขึ้นจะวิ่งวงที่ใหญ่ขึ้นในสัดส่วนเดียวกัน จึงใช้เวลาครบรอบเท่าเดิม นี่คือหลักการของไซโคลตรอน ส่วนความถี่ \(f\) เรียกว่าความถี่ไซโคลตรอน</p>
<div class="wx"><div class="wx-q">โปรตอนวิ่งด้วยอัตราเร็ว \(1.0\times10^{6}\ \text{m/s}\) ในทิศตั้งฉากกับสนามแม่เหล็กสม่ำเสมอ 0.50 T จะวิ่งเป็นวงกลมรัศมีเท่าใด และใช้เวลาวนครบหนึ่งรอบเท่าใด (\(m_p = 1.67\times10^{-27}\ \text{kg}\), \(e = 1.6\times10^{-19}\ \text{C}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(m = 1.67\times10^{-27}\ \text{kg}\), \(q = 1.6\times10^{-19}\ \text{C}\), \(v = 1.0\times10^{6}\ \text{m/s}\), \(B = 0.50\ \text{T}\) ตั้งฉากกัน หารัศมี \(r\) และคาบ \(T\)</li>
<li><b>เลือกสมการ:</b> แรงแม่เหล็กทำหน้าที่เป็นแรงสู่ศูนย์กลาง \(qvB = \dfrac{mv^2}{r}\) จึงได้ \(r = \dfrac{mv}{qB}\) และ \(T = \dfrac{2\pi m}{qB}\)</li>
<li><b>แทนค่า:</b> \(r = \dfrac{(1.67\times10^{-27})(1.0\times10^{6})}{(1.6\times10^{-19})(0.50)}\) \(\approx 2.1\times10^{-2}\ \text{m}\) หรือ 2.1 cm และ \(T = \dfrac{2\pi(1.67\times10^{-27})}{(1.6\times10^{-19})(0.50)}\) \(\approx 1.3\times10^{-7}\ \text{s}\)</li>
<li><b>ตรวจคำตอบ:</b> คิดอีกทางด้วย \(T = \dfrac{2\pi r}{v} = \dfrac{2\pi(0.021)}{1.0\times10^{6}}\) \(\approx 1.3\times10^{-7}\ \text{s}\) ตรงกัน ✓ โปรตอนวนได้ราว 7.6 ล้านรอบต่อวินาที ถ้าเร็วขึ้นเป็น 2 เท่า วงจะใหญ่ขึ้นเป็น 4.2 cm แต่คาบยังเท่าเดิม</li>
</ol></div>
<p><a class="try" href="#particle-sim">ลองเปลี่ยน v ในการจำลองแล้วดูว่าคาบ T เปลี่ยนไหม →</a></p>

<h2 id="s3"><span class="num">3</span>การเคลื่อนที่แบบเกลียว</h2>
<p>ถ้าความเร็วทำมุม \(\theta\) กับสนาม ให้แยกความเร็วเป็นสองส่วน</p>
<ul>
  <li>\(v_\perp = v\sin\theta\) ตั้งฉากกับ \(\vec B\) → ทำให้วนเป็นวงกลมรัศมี \(r = mv_\perp/qB\)</li>
  <li>\(v_\parallel = v\cos\theta\) ขนานกับ \(\vec B\) → ไม่มีแรงกระทำ จึงเคลื่อนที่ด้วยความเร็วคงตัว</li>
</ul>
<p>ผลรวมคือ <strong>เกลียว (helix)</strong> ที่มีแกนขนานกับสนาม ระยะที่เลื่อนไปต่อหนึ่งรอบเรียกว่าระยะพิตช์ \(p = v_\parallel T\)</p>
<div class="wx"><div class="wx-q">อิเล็กตรอนวิ่งด้วยอัตราเร็ว \(5.0\times10^{6}\ \text{m/s}\) เข้าไปในสนามแม่เหล็กสม่ำเสมอ 1.0 mT โดยความเร็วทำมุม 30° กับสนาม เกลียวที่ได้มีรัศมีและระยะพิตช์เท่าใด (\(m_e = 9.11\times10^{-31}\ \text{kg}\), \(e = 1.6\times10^{-19}\ \text{C}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(v = 5.0\times10^{6}\ \text{m/s}\), \(\theta = 30^\circ\) (มุมกับสนาม), \(B = 1.0\ \text{mT} = 1.0\times10^{-3}\ \text{T}\) หารัศมี \(r\) และระยะพิตช์ \(p\)</li>
<li><b>เลือกสมการ:</b> แยกความเร็ว \(v_\perp = v\sin\theta\) (ทำให้วน) และ \(v_\parallel = v\cos\theta\) (พาเลื่อนไปตามสนาม) แล้วใช้ \(r = \dfrac{mv_\perp}{qB}\), \(T = \dfrac{2\pi m}{qB}\) และ \(p = v_\parallel T\)</li>
<li><b>แทนค่า:</b> \(v_\perp = 2.5\times10^{6}\ \text{m/s}\), \(v_\parallel \approx 4.33\times10^{6}\ \text{m/s}\) จึงได้ \(r = \dfrac{(9.11\times10^{-31})(2.5\times10^{6})}{(1.6\times10^{-19})(1.0\times10^{-3})}\) \(\approx 1.4\times10^{-2}\ \text{m}\) คาบ \(T = \dfrac{2\pi(9.11\times10^{-31})}{(1.6\times10^{-19})(1.0\times10^{-3})}\) \(\approx 3.58\times10^{-8}\ \text{s}\) และ \(p = (4.33\times10^{6})(3.58\times10^{-8})\) \(\approx 0.155\ \text{m}\)</li>
<li><b>ตีความ:</b> เกลียวรัศมีราว 1.4 cm ในหนึ่งรอบอิเล็กตรอนวนได้ระยะเท่าเส้นรอบวง \(2\pi r \approx 8.9\ \text{cm}\) (ด้วย \(v_\perp\)) ขณะเดียวกันเลื่อนไปตามสนาม 15.5 cm (ด้วย \(v_\parallel\)) ซึ่งยาวกว่า เพราะที่ 30° \(v_\parallel > v_\perp\) ถ้าเผลอใช้ \(v\sin\theta\) คำนวณระยะพิตช์ จะได้ 8.9 cm ซึ่งคือเส้นรอบวง ไม่ใช่ระยะพิตช์</li>
</ol></div>
<div class="feyn"><div class="tag">อธิบายแบบ Feynman</div>
เหมือนเดินขึ้นบันไดวนในตึก การเดินวนรอบเสา (ส่วนตั้งฉาก) กับการขึ้นสูงทีละชั้น (ส่วนขนาน) เกิดขึ้นพร้อมกันโดยไม่รบกวนกัน อนุภาคจากลมสุริยะก็ “เดินบันไดวน” ไปตามเส้นสนามแม่เหล็กโลกลงสู่ขั้วโลก แล้วชนกับอากาศจนเกิดแสงเหนือ–แสงใต้</div>

<h2 id="s4"><span class="num">4</span>ตัวเลือกความเร็วและแมสสเปกโทรมิเตอร์</h2>
<p>ถ้าให้สนามไฟฟ้า \(\vec E\) และสนามแม่เหล็ก \(\vec B\) ตั้งฉากกัน แรงไฟฟ้า \(qE\) และแรงแม่เหล็ก \(qvB\) จะหักล้างกันพอดีเฉพาะอนุภาคที่มีอัตราเร็ว</p>
<div class="eq">\[ qE = qvB \;\Longrightarrow\; v = \frac{E}{B} \]</div>
<p class="xref">แรงไฟฟ้า \(qE\) มาจากสนามไฟฟ้า → <a href="#estat?s=s3">บทที่ 04 ไฟฟ้าสถิต หัวข้อสนามไฟฟ้า</a></p>
<p>อนุภาคความเร็วนี้วิ่งตรงผ่านไปได้ ตัวอื่นจะเบนออก เมื่อคัดความเร็วแล้วส่งเข้าสนามแม่เหล็กอย่างเดียว รัศมี \(r = mv/qB\) จะบอกอัตราส่วน \(m/q\) ได้ ทอมสันใช้แนวคิดนี้วัด \(e/m\) ของอิเล็กตรอนในปี 1897 และเป็นหลักการของแมสสเปกโทรมิเตอร์ที่ใช้แยกไอโซโทป</p>
<div class="wx"><div class="wx-q">ไอออนคาร์บอน ¹²C⁺ (มวล 12 u ประจุ \(+e\)) ผ่านตัวเลือกความเร็วที่มี \(E = 4.0\times10^{4}\ \text{V/m}\) และ \(B = 0.080\ \text{T}\) แล้ววิ่งตั้งฉากเข้าสู่สนามแม่เหล็ก 0.50 T ของแมสสเปกโทรมิเตอร์ ไอออนวิ่งเป็นวงกลมรัศมีเท่าใด (\(e = 1.6\times10^{-19}\ \text{C}\), \(1\ \text{u} = 1.66\times10^{-27}\ \text{kg}\))</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> ตัวเลือกความเร็ว: \(E = 4.0\times10^{4}\ \text{V/m}\), \(B = 0.080\ \text{T}\) สนามช่วงที่สอง \(B' = 0.50\ \text{T}\) มวล \(m = 12\ \text{u}\) ประจุ \(+e\) หาอัตราเร็วก่อน แล้วหารัศมี \(r\)</li>
<li><b>เลือกสมการ:</b> ไอออนที่ผ่านตัวเลือกความเร็วได้ต้องมีแรงหักล้างกัน \(qE = qvB\) จึงได้ \(v = \dfrac{E}{B}\) จากนั้นในสนาม \(B'\) อย่างเดียว \(r = \dfrac{mv}{qB'}\)</li>
<li><b>แทนค่า:</b> \(v = \dfrac{4.0\times10^{4}}{0.080} = 5.0\times10^{5}\ \text{m/s}\) มวล \(m = 12 \times 1.66\times10^{-27}\) \(= 1.99\times10^{-26}\ \text{kg}\) จึงได้ \(r = \dfrac{(1.99\times10^{-26})(5.0\times10^{5})}{(1.6\times10^{-19})(0.50)}\) \(\approx 0.125\ \text{m}\)</li>
<li><b>ตีความ:</b> รัศมีราว 12.5 cm ไอออน ¹³C⁺ ที่ผ่านตัวเลือกความเร็วเดียวกันมีอัตราเร็วเท่ากัน แต่ \(r \propto m\) จึงวนรัศมีราว 13.5 cm และชนแผ่นตรวจวัดห่างออกไปอีกราว 2 cm ตัวเลือกความเร็วไม่สนมวล แต่สนามช่วงที่สองแยกมวลออกจากกัน</li>
</ol></div>

<p class="x"><b>เข้าใจผิด:</b> อนุภาคที่หนักกว่าจะเลี้ยววงแคบกว่าเพราะถูกแรงมากกว่า</p>
<p class="ok"><b>ที่ถูกต้อง:</b> แรง \(qvB\) ไม่ขึ้นกับมวล อนุภาคที่ \(m/q\) มากกว่ามีความเฉื่อยมากกว่า จึงเลี้ยว<em>ยากกว่า</em> และวงใหญ่กว่า เช่น แอลฟา (\(m/q\) เป็น 2 เท่าของโปรตอน) จะวิ่งวงใหญ่เป็น 2 เท่าที่อัตราเร็วเท่ากัน</p></div>

<h2 id="s1"><span class="num">1</span>คลื่นแม่เหล็กไฟฟ้าเกิดได้อย่างไร</h2>
<p>ฟาราเดย์พบว่า <strong>สนามแม่เหล็กที่เปลี่ยนแปลงทำให้เกิดสนามไฟฟ้า</strong> แมกซ์เวลล์เสนอว่าในทางกลับกัน <strong>สนามไฟฟ้าที่เปลี่ยนแปลงก็ทำให้เกิดสนามแม่เหล็ก</strong> เมื่อประจุมี<em>ความเร่ง</em> เช่น อิเล็กตรอนที่สั่นขึ้นลงในเสาอากาศ สนามรอบตัวมันเปลี่ยนแปลง สนามทั้งสองจึงเหนี่ยวนำกันต่อเนื่องและแผ่ออกไปเป็นคลื่น</p>
<p>แมกซ์เวลล์คำนวณอัตราเร็วของคลื่นนี้จากค่าคงที่ทางไฟฟ้าและแม่เหล็ก</p>
<div class="eq">\[ c = \frac{1}{\sqrt{\mu_0\varepsilon_0}} \approx 3.00\times10^{8}\ \text{m/s} \]</div>
<p>ผลลัพธ์ตรงกับอัตราเร็วแสงที่วัดได้ จึงสรุปว่าแสงเป็นคลื่นแม่เหล็กไฟฟ้า และเฮิรตซ์ยืนยันการมีอยู่ของคลื่นนี้ด้วยการทดลองในปี 1887</p>
<div class="wx"><div class="wx-q">ใช้ค่าคงที่ \(\mu_0 = 4\pi\times10^{-7}\ \text{T·m/A}\) และ \(\varepsilon_0 = 8.85\times10^{-12}\ \text{C}^2/(\text{N·m}^2)\) คำนวณอัตราเร็วของคลื่นแม่เหล็กไฟฟ้าแบบแมกซ์เวลล์ แล้วหาว่าแสงจากดวงอาทิตย์ใช้เวลาเท่าใดในการเดินทางผ่านอวกาศ \(1.50\times10^{11}\ \text{m}\) มาถึงโลก</div>
<ol class="wx-steps">
<li><b>รู้อะไรบ้าง / หาอะไร:</b> \(\mu_0 = 4\pi\times10^{-7}\), \(\varepsilon_0 = 8.85\times10^{-12}\) (หน่วย SI) และระยะทาง \(d = 1.50\times10^{11}\ \text{m}\) หาอัตราเร็ว \(c\) และเวลา \(t\)</li>
<li><b>เลือกสมการ:</b> \(c = \dfrac{1}{\sqrt{\mu_0\varepsilon_0}}\) และเพราะแสงเคลื่อนที่ด้วยอัตราเร็วคงตัวในสุญญากาศ \(t = \dfrac{d}{c}\)</li>
<li><b>แทนค่า:</b> \(\mu_0\varepsilon_0 = (4\pi\times10^{-7})(8.85\times10^{-12})\) \(\approx 1.112\times10^{-17}\) ถอดรากได้ \(\approx 3.335\times10^{-9}\) จึงได้ \(c \approx 3.00\times10^{8}\ \text{m/s}\) และ \(t = \dfrac{1.50\times10^{11}}{3.00\times10^{8}}\) \(= 500\ \text{s}\) หรือราว 8.3 นาที</li>
<li><b>ตีความ:</b> ค่าที่ได้จากค่าคงที่ทางไฟฟ้าและแม่เหล็กล้วน ๆ ตรงกับอัตราเร็วแสงที่วัดได้ นี่คือหลักฐานว่าแสงเป็นคลื่นแม่เหล็กไฟฟ้า แสงข้ามอวกาศที่ว่างเปล่ามาได้โดยไม่ต้องมีตัวกลาง และดวงอาทิตย์ที่เราเห็นคือภาพเมื่อราว 8 นาทีก่อน</li>
</ol></div>
